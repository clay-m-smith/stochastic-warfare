name: Production benchmark integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 7 * * 1"
  workflow_dispatch:
    inputs:
      run_golan:
        description: Run the manual full Golan paired comparison
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: benchmark-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Benchmark policy and measurement contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --extra dev --locked

      - name: Run focused benchmark policy tests
        run: >-
          uv run --no-sync python scripts/run_pytest_partition.py
          benchmark-policy
          --manifest artifacts/benchmark-policy/manifest.json
          --junit artifacts/benchmark-policy/junit.xml
          --forbid-skips
          --timeout-seconds 600

      - name: Upload benchmark policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-policy-${{ github.run_id }}
          path: artifacts/benchmark-policy/
          if-no-files-found: error

  easting:
    name: 73 Easting workload transition
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --extra dev --locked

      - name: Run exact reference/candidate workload transition
        run: >-
          uv run --no-sync python scripts/run_paired_benchmark.py transition
          --scenario 73_easting
          --artifact "${RUNNER_TEMP}/transition-73-easting.json"
          --worker-timeout-seconds 300

      - name: Bind workload transition to clean final commit
        run: >-
          uv run --no-sync python scripts/run_paired_benchmark.py verify-final
          --artifact "${RUNNER_TEMP}/transition-73-easting.json"
          --verification
          "${RUNNER_TEMP}/transition-73-easting-final-tree.json"
          --worker-timeout-seconds 300

      - name: Upload complete or partial workload-transition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transition-73-easting-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/transition-73-easting.json
            ${{ runner.temp }}/transition-73-easting-final-tree.json
          if-no-files-found: error
          retention-days: 30

  golan:
    name: Golan manual paired gate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_golan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --extra dev --locked

      - name: Run same-host reference/candidate pairs
        run: >-
          uv run --no-sync python scripts/run_paired_benchmark.py
          --scenario golan_heights
          --artifact "${RUNNER_TEMP}/paired-golan-heights.json"
          --worker-timeout-seconds 900

      - name: Bind comparison to clean final commit
        run: >-
          uv run --no-sync python scripts/run_paired_benchmark.py verify-final
          --artifact "${RUNNER_TEMP}/paired-golan-heights.json"
          --verification
          "${RUNNER_TEMP}/paired-golan-heights-final-tree.json"
          --worker-timeout-seconds 900

      - name: Upload complete or partial comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-golan-heights-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/paired-golan-heights.json
            ${{ runner.temp }}/paired-golan-heights-final-tree.json
          if-no-files-found: error
          retention-days: 30

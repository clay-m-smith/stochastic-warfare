[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stochastic-warfare"
version = "0.1.0"
description = "High-fidelity stochastic wargame simulator"
requires-python = ">=3.12"
license-files = ["LICENSE.md"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.0",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "shapely>=2.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "matplotlib>=3.8",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
]
perf = [
    "numba>=0.59",
]
mcp = [
    "mcp[cli]>=1.2.0",
]
terrain = [
    "rasterio>=1.3",
    "xarray>=2024.1",
]
docs = [
    "mkdocs-material>=9.5",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
strict_markers = true
addopts = "-m 'not slow and not benchmark' --ignore=tests/api --ignore=tests/e2e"
markers = [
    "slow: marks tests as slow (1000-run Monte Carlo, run explicitly with '-m slow')",
    "benchmark: marks tests as performance benchmarks (run explicitly with '-m benchmark')",
    "api: marks API tests (require api extra)",
    "e2e: marks end-to-end tests running full scenarios via API (run explicitly with '-m e2e')",
    "structural: marks diagnostic tests whose strongest oracle is structural rather than behavioral",
]

[project.scripts]
stochastic-warfare = "stochastic_warfare.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 120
[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
]
ignore = [
    "E402",  # module-level import not at top — conditional/optional imports
    "E501",  # line too long — defer to format check
    "E701",  # multiple statements on one line (colon)
    "E702",  # multiple statements on one line (semicolon)
    "E731",  # lambda assignment — acceptable in callbacks
    "E741",  # ambiguous variable name — common in math code
]

[tool.ruff.lint.isort]
known-first-party = ["stochastic_warfare", "api"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["stochastic_warfare", "stochastic_warfare.*", "api", "api.*"]
namespaces = false

[tool.setuptools.exclude-package-data]
"*" = ["*.pyi", "py.typed"]

[tool.setuptools.cmdclass]
build_py = "build_hooks.CatalogBuildPy"
sdist = "build_hooks.AllowlistedSdist"

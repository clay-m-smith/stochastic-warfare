# One aggregate heterogeneous forward gun battery for a sixteenth-century
# Mediterranean war galley. This is not a single physical cannon and does not
# reuse a ballista. The source review identifies a 50-pounder centerline gun
# with accompanying lighter cannon; NHHC establishes the forward-gun role and
# its anti-galley effect:
# https://gjh.ojs.chass.ncsu.edu/index.php/Graduate/article/download/13/pdf_7
# https://www.history.navy.mil/research/library/online-reading-room/title-list-alphabetically/e/evolution-of-naval-weapons.html
#
# The 500 m range, 0.2 rpm aggregate cadence, ten-round allocation, dispersion,
# and reliability are explicit conservative modeled bounds because the public
# sources do not publish a common ballistic table for this heterogeneous
# battery. Caliber/muzzle velocity remain zero rather than inventing one bore.

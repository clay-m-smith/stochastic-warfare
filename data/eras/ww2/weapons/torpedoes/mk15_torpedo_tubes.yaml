# Exact Fletcher-class surface-torpedo system. The U.S. Navy Bureau of
# Ordnance history identifies Mark 15 as the normal surface-ship torpedo:
# https://www.ibiblio.org/hyperwar/USN/Admin-Hist/BuOrd/BuOrd-6.html
#
# NUSC Technical Document 5436 records a 21-inch (533.4 mm), gyro-controlled
# weapon and three selectable speed/range settings. The current catalog schema
# has one range/speed envelope, so this definition uses the coherent high-speed
# setting (45 kn at 6,000 yd), never a best-of-all-settings hybrid:
# https://www.maritime.org/doc/jolie/part2.php
#
# The authored equipment is the complete pair of quintuple launchers. Ten
# loaded tubes are therefore its finite magazine; no underway reload is
# represented by this definition.

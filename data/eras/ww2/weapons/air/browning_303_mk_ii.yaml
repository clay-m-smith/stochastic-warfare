# One physical Browning .303 Mk II aircraft machine gun, independent of xN.
# Imperial War Museums identifies the RAF .303 Browning Mk II; the RAF Museum
# historical study documents its conventional aircraft armament role.
# https://www.iwm.org.uk/collections/item/object/30034904
# https://www.rafmuseum.org.uk/documents/Research/RAF-Historical-Society-Journals/Journal_45_Seminar_conventional_weapons.pdf
# The archived Spitfire pilot's notes establish the installation context.
# https://www.awm.gov.au/collection/LIB33055
# The Spitfire wing installation carried 350 rounds per gun. The 1,150 rpm
# rate is the Mk II aircraft-gun cyclic rate. A Canadian veterans archive
# records about 300 yards as the harmonized combat range used here.
# https://veterans.gc.ca/en/news-and-media/video-gallery/spitfire

# British Ordnance QF 6-pounder L/50 anti-tank gun.
# The authored catalog says L/50 but does not name a Mark; this ID preserves
# that bounded identity instead of inventing Mk III/Mk IV provenance.
# Norfolk Tank Museum identifies the Mk IV as the British L/50 model, and
# Australian War Memorial documents its AP/APC/APCBC/APCR/APDS ammunition.
# https://norfolktankmuseum.co.uk/ordnance-qf-6-pounder/
# https://www.awm.gov.au/collection/C239208
# Official US War Department TM 9-1904 documents the ballistically compatible
# licensed 57 mm M1 system.
# https://www.ibiblio.org/hyperwar/USA/ref/TM/pdfs/TM9-1904.pdf
# The official Standard Ordnance Items catalog gives about 30 rpm, 10,260 yard
# maximum range, and 2,810 lb complete weapon weight.
# https://www.ibiblio.org/hyperwar/NHC/NewPDFs/USArmy/US%20military%20Technical%20and%20Field%20manuals/Standard.Ordnance.Items.Catalog.Vol.2.1944.pdf
# This manually loaded gun has no integral magazine. Capacity 1 represents the
# chambered round; explicit crew-ready stores remain a logistics follow-up.

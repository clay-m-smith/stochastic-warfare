# Napoleonic-era 9-pounder naval long gun.
#
# - U.S. Naval History and Heritage Command documents 9-pounder chase long
#   guns as shipboard combat weapons and distinguishes their longer-range role
#   from carronades.
#   https://www.history.navy.mil/about-us/leadership/director/directors-corner/h-grams/h-gram-097/h-097-1.html
# - NHHC's Valcour Bay archaeology report identifies standard 9-pound round
#   shot as 4 inches (10.1 cm) in diameter.
#   https://www.history.navy.mil/content/dam/nhhc/research/underwater-archaeology/PDF/UA_ValcourBay.pdf
# - NHHC's account of eighteenth-century naval operations documents warships
#   using their cannon to bombard a town, supporting the general shore-fire
#   capability of this period's naval long-gun interface.
#   https://www.history.navy.mil/about-us/leadership/director/directors-corner/h-grams/h-gram-094/h-094-1.html
#
# Ballistic and accuracy fields use the same conservative black-powder
# long-gun abstraction as the neighboring 24- and 32-pounder catalog entries;
# this is not a claim of one exact national pattern or casting.

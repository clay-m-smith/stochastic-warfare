# British 18-pounder long gun.  USNI's period-ordnance table gives a 5.292-inch
# bore, 42 cwt tube, 6 lb service charge, and distinguishes it from the much
# shorter carronade.  The 515 m/s velocity follows the documented 1,690 fps
# smoothbore service value; the range envelope is the repository's conservative
# direct-fire naval model, not a claim of aimed fire at maximum ballistic range.
# https://www.usni.org/magazines/proceedings/1973/august/carronade
# https://en.wikisource.org/wiki/Page:EB1911_-_Volume_20.djvu/237

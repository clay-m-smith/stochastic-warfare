# QF 6-pounder 6 cwt Hotchkiss tank gun.
#
# Role and ammunition are fixed by the surviving-gun and ammunition records:
# - Australian War Memorial RELAWM05041 identifies the Mk II 6 cwt gun as the
#   Mark IV Male tank's main armament.
#   https://www.awm.gov.au/collection/C240439
# - Australian War Memorial REL37319.002 identifies the 57 mm Mk XIII AP
#   projectile recovered from a First World War Male tank.
#   https://www.awm.gov.au/collection/C1223104
# - The Tank Museum records a 57 mm, 6 lb projectile and both HE and solid shot.
#   https://tankmuseum.org/tank-armament-first-world-war/
#
# The 1,000 m effective envelope is a conservative tactical model boundary, not
# a claim that the gun's ballistic maximum was only 1,000 m. It reflects the
# Tank Museum's finding that firing accurately while moving was impractical.

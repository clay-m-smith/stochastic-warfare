# - Imperial War Museums ORD 117 identifies the surviving 57 mm gun and its
#   association with the German Army A7V.
#   https://www.iwm.org.uk/collections/item/object/30025235
# - The Tank Museum records the A7V using its 57 mm gun with grape shot against
#   an entrenched quarry during the 21 March 1918 action.
#   https://tankmuseum.org/action-debut-of-the-a7v-tank/
# - The digitized British War Office land-service handbook documents the
#   6-pounder Nordenfelt mechanism and common-shell ammunition family.
#   https://books.google.com/books?id=rOgE_aL78vUC

# GBU-16 Paveway II 1000lb Laser-Guided Bomb
# Mk 83 (~447 kg) base warhead with Paveway II semi-active laser seeker
# kit. Requires continuous laser designation from airborne or ground spotter.
# At the Battle of Debecka Pass (2003), an F-14B (VF-32) delivered a GBU-16
# in the friendly-fire incident at ~T+3 hours. Vulnerable to smoke/obscurants
# and laser-lost events relative to GPS-guided JDAMs.
# Sources:
#   - USAF Fact Sheet GBU-16 (Tier 1)
#   - Jane's Air-Launched Weapons (Tier 3)

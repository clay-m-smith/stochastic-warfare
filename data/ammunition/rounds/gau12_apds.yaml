# NOTE: Uses AmmoDefinition schema (ammo_id) — same as 25mm_m791_apds.yaml.
#
# Sources:
#   - GWAPS Vol. IV "Weapons, Tactics, and Training" (Tier 1)
#   - TM 43-0001-27 (Tier 1)
#   - Jane's Ammunition Handbook, 25mm PGU-32 entry (Tier 3)

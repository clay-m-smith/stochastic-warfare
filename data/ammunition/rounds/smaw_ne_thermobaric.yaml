# SMAW NE (Novel Explosive / Thermobaric) 83.5mm Rocket
# Thermobaric ("fuel-air") variant of the SMAW rocket using PBXIH-135
# (~1.4kg). Fielded by USMC in late 2004 and used extensively at 2nd
# Fallujah for room/structure clearance; overpressure propagates through
# open volumes and lethally amplifies inside confined rooms.
#
# ENGINE LIMITATION (accepted, Phase 101): The simulation engine has no
# dedicated thermobaric / overpressure pathway. This round is authored as
# an INFLATED-RADIUS HE (ammo_type: HE) — blast_radius scaled ~2x vs. the
# comparable HEDP round to approximate the open-area lethality. Confined-
# space amplification is out of scope here and belongs to the structure /
# interior-engagement layer. Propagate updates if/when a thermobaric path
# is added (Block 11+).
#
# Sources:
#   - USMC Lessons Learned, Ops Vigilant Resolve / Phantom Fury (Tier 1)
#   - Marine Corps Gazette (Nov 2005) "SMAW-NE at Fallujah" (Tier 3)
#   - GlobalSecurity.org "SMAW-NE" (Tier 3)
#   - Fuel-Air Explosives — Janes IDR (Tier 3)
ammo_id: smaw_ne_thermobaric
display_name: "SMAW NE Thermobaric 83.5mm Rocket"
ammo_type: HE
mass_kg: 6.4
diameter_mm: 83.5
drag_coefficient: 0.40
penetration_mm_rha: 0.0
penetration_reference_range_m: 0.0
blast_radius_m: 15.0
fragmentation_radius_m: 25.0
explosive_fill_kg: 1.4
guidance: NONE
propulsion: solid_rocket
max_speed_mps: 220.0
unit_cost_factor: 1.2

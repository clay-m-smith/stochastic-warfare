# ~440mm RHA penetration; ~1.8kg warhead; effective against light armored
# vehicles, APCs, and fortifications. Single-shot expendable.
# Sources:
#   - TM 9-1340-214-12&P "Rocket, HEAT, 84mm, M136" (Tier 1)
#   - Saab Bofors AT-4 Product Datasheet (Tier 3)
#   - Jane's Ammunition Handbook (Tier 3)

# SMAW HEDP (High-Explosive Dual-Purpose) 83.5mm Rocket
# Primary general-purpose round for the Mk 153 SMAW. Dual-purpose: fuzed to
# penetrate ~200mm RHA-equivalent (light armor / concrete bunker face) and
# produce significant fragmentation against infantry in the open. ~1.8kg HE
# fill; ~6kg rocket weight; blast radius ~8m; frag ~15m.
# Sources:
#   - TM 08670A-10/1 "Mk 153 Mod 0 SMAW" (Tier 1)
#   - USMC Lessons Learned, 2nd Bn 1st Marines Fallujah AAR (Tier 1)
#   - Jane's Infantry Weapons (Tier 3)
ammo_id: smaw_hedp

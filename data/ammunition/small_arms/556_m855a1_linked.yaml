# Linked 5.56x45mm M855A1 Enhanced Performance Round for the M249.
#
# The U.S. Army JPEO Armaments & Ammunition direct-fire handbook identifies
# M855A1 as the M249 linked combat cartridge, with a 62 grain projectile and
# 3,070 ft/s velocity measured 78 feet from the muzzle:
# https://jpeoaa.army.mil/Portals/94/Documents/JPEOAAPortfolioBook_2025.pdf
#
# The public Army portfolio does not provide an RHA terminal limit. The model
# therefore leaves penetration unset instead of copying the legacy M855
# abstraction. `max_speed_mps` is the converted released 78-foot datum.
ammo_id: 556_m855a1_linked
display_name: "5.56x45mm M855A1 EPR, Linked"
ammo_type: BALL
mass_kg: 0.00402
diameter_mm: 5.56
drag_coefficient: 0.30
penetration_mm_rha: 0.0
penetration_reference_range_m: 0.0
blast_radius_m: 0.0
fragmentation_radius_m: 0.0
guidance: NONE
propulsion: none
max_speed_mps: 935.7
unit_cost_factor: 0.03

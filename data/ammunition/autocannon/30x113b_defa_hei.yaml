# 30x113B HEI ammunition for the DEFA 553.
#
# The KNDS 2024/25 ammunition catalog identifies 30x113B ammunition as
# intended for DEFA weapons; the HEI family uses a 275 g projectile and a
# released 775 m/s velocity envelope:
# https://knds.com/media/catalogue_munitions_85ae594873.pdf
#
# A 16 g fill is the catalog's HEI-family payload. The small effect radii are
# conservative runtime abstractions rather than claims about fragment pattern.
ammo_id: 30x113b_defa_hei
display_name: "30x113B DEFA HEI"
ammo_type: HE
mass_kg: 0.275
diameter_mm: 30.0
drag_coefficient: 0.29
blast_radius_m: 2.0
fragmentation_radius_m: 7.0
explosive_fill_kg: 0.016
guidance: NONE
propulsion: none
max_speed_mps: 775.0
unit_cost_factor: 0.25

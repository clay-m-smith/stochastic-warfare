# 9M21 (FROG-7 / Luna-M) HE-Fragmentation Warhead
# Large unguided tactical rocket with ~457 kg HE-fragmentation warhead
# (9M21-F variant). Range ~70 km with CEP ~700 m — inaccurate area weapon.
# Iraqi FROG-7 batteries near the Saudi border were the target of AC-130H
# Spirit 03's final mission at Khafji (dawn 31 Jan 1991).
#
# NOTE: Uses AmmoDefinition schema (ammo_id) — same as m26_mlrs_rocket.yaml.
#
# Sources:
#   - Jane's Strategic Weapon Systems, 9K52 Luna-M entry (Tier 3)
#   - GWAPS Vol. IV "Weapons, Tactics, and Training" (Tier 1)
#   - FM 100-2-3 "The Soviet Army" (Tier 1)

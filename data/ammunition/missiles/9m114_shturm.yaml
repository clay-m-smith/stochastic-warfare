# 9M114 Shturm-V / AT-6 Spiral command-guided anti-tank missile.
#
# The U.S. Defense Intelligence-derived ATGM table gives the helicopter AT-6V
# a 1,000-6,000 m engagement envelope, SACLOS radio-command guidance, and
# 700 mm RHA penetration:
# https://man.fas.org/dod-101/sys/land/row/atgms.htm
#
# Public WEG values bound the 130 mm missile near 31.4 kg and 560 m/s. The
# runtime probability and countermeasure fields are conservative simulation
# inputs, not source-reported single-shot probabilities.
ammo_id: 9m114_shturm
display_name: "9M114 Shturm-V ATGM"
ammo_type: HEAT
mass_kg: 31.4
diameter_mm: 130.0
drag_coefficient: 0.27
penetration_mm_rha: 700.0
penetration_reference_range_m: 0.0
blast_radius_m: 4.0
fragmentation_radius_m: 8.0
guidance: COMMAND
seeker_fov_deg: 10.0
seeker_range_m: 6000.0
pk_at_reference: 0.65
countermeasure_susceptibility: 0.25
propulsion: rocket
max_speed_mps: 560.0
flight_time_s: 11.0
terminal_maneuver: false
unit_cost_factor: 18.0

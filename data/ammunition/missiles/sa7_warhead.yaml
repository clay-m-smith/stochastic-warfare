# warhead with impact/graze fuze. Defeated by hot-exhaust deflectors, flares,
# and all-aspect aircraft. Rear-quarter only seeker. Credited in AC-130H
# Spirit 03 loss (31 Jan 1991) — wing damage from fragmentation hit.

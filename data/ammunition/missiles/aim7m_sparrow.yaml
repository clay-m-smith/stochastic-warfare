# AIM-7M Sparrow semi-active-radar air-to-air missile.
#
# The U.S. Air Force fact file identifies the AIM-7M, 225 kg launch mass,
# 200 mm diameter, Mk 58 solid motor, annular blast-fragmentation warhead, and
# semi-active radar guidance. It explicitly classifies speed and range:
# https://www.af.mil/About-Us/Fact-Sheets/Display/Article/104575/aim-7-sparrow/
# NAVAIR's public product envelope bounds the Sparrow family near 30 km and
# Mach 4:
# https://www.navair.navy.mil/product/Air-Intercept-Missile-AIM-7-Sparrow
#
# Effect radii and probability fields are conservative runtime inputs and are
# not represented as released USAF performance.

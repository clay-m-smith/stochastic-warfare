# AGM-65 Maverick Warhead (D/G Variant Representative — 136 kg SAP)
# The Maverick family has two warhead classes:
#   - WDU-20 conical shaped-charge, 57 kg (AGM-65A/B/D/H/K) — anti-armor
#   - WDU-24 penetrating / semi-armor-piercing, 136 kg (AGM-65E/F/G/J)
# This file represents the heavy WDU-24 SAP warhead as carried on the
# AGM-65D/G models dominant at Khafji against Iraqi armor columns.
#
# NOTE: Uses AmmoDefinition schema (ammo_id) — same as tow2_warhead.yaml.
#
# Sources:
#   - GWAPS Vol. IV "Weapons, Tactics, and Training" (Tier 1)
#   - Grant, Rebecca. "The War Report: Khafji" Air Force Magazine (Tier 2)
#   - Jane's Air-Launched Weapons, AGM-65 entry (Tier 3)

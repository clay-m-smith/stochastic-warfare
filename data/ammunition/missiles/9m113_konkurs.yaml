# Baseline 9M113 Konkurs/AT-5A missile, not the tandem Konkurs-M.
# U.S. Army GTA 20-10-001 reports 135 mm caliber, 70-4,000 m engagement
# envelope, 600 mm armor penetration, and SACLOS guidance. ODIN establishes
# wire-transmitted launcher commands, roughly 200 m/s flight speed, and a
# quoted 0.90 hit probability that is retained as a catalog abstraction.
# https://irp.fas.org/world/russia/tradoc-refguide.pdf
# https://odin.t2com.army.mil/WEG/Asset/9M113_Konkurs_

# M16A4 Rifle
# USMC primary service rifle at 2nd Battle of Fallujah (Nov 2004). Longer
# 20-inch barrel than the M4A1 carbine improves velocity and effective range.
# Standard issue in USMC rifle companies until the M4A1 transition (2015+).
# Chambered for 5.56x45mm NATO; semi-auto + 3-round burst (no full auto on
# standard M16A4). STANAG 30-round magazine. Effective range ~550m point.
# Sources:
#   - TM 05538C-23&P/2 "M16A4 Service Rifle" (Tier 1)
#   - USMC MCRP 3-01A "Rifle Marksmanship" (Tier 1)

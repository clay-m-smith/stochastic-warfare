# M72A7 66mm LAW
# Nammo M72A7 Light Anti-armor Weapon — modern improved variant of the
# Vietnam-era M72. Disposable single-shot, 66mm HEAT. Lightweight (~3.5kg)
# with ~350mm RHA penetration. ~350m point target; min-arm ~10m; MV ~200 m/s.
# Widely issued to USMC rifle squads at Fallujah as a lightweight alternative
# when an AT-4 or SMAW was unavailable.
# Sources:
#   - TM 9-1340-222-13&P "M72A7 LAW" (Tier 1)
#   - Nammo M72A7 Product Datasheet (Tier 3)

# MATADOR / RGW 90 HH disposable anti-armor and anti-structure weapon.
#
# Authoritative role and fielded envelope:
# - Singapore Army SAF Ammunition Command: one-man shoulder-operated,
#   dual-mode HEAT/HESH system, effective to 300 m against armored vehicles
#   and unreinforced brick walls.
#   https://www.army.gov.sg/our-forces/formations/saf-ammunition-command/
# - Singapore National Archives, MINDEF MATADOR factsheet: 90 mm,
#   man-portable and disposable.
#   https://www.nas.gov.sg/archivesonline/data/pdfdoc/MINDEF_20040904001/MINDEF_20040904003.pdf
# - Dynamit Nobel Defence RGW 90 HH product data corroborates the 90 mm
#   HEAT/HESH identity and >500 mm RHA anti-armor effect.
#   https://dn-defence.com/rgw-90/rgw-90-hh/?lang=en
#
# Guidance remains NONE: "fire and forget" in the Singapore description means
# the unguided round needs no post-launch input, not that it has a seeker.

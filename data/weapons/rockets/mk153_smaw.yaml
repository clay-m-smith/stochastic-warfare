# Mk 153 Shoulder-Launched Multipurpose Assault Weapon (SMAW)
# USMC reloadable 83.5mm rocket launcher. Used extensively in 2nd Fallujah
# (Nov 2004) for bunker-busting, wall breaching, and anti-personnel strikes.
# Fires HEDP (smaw_hedp) and the novel-explosive thermobaric NE round
# (smaw_ne_thermobaric). ~500m point target / ~1000m area; min-arm ~10m.
# Reload ~30s; sustained 3-5 rpm; 12.6kg launcher + ~6kg per rocket.
# Sources:
#   - TM 08670A-10/1 "Mk 153 Mod 0 SMAW" (Tier 1)
#   - USMC Lessons Learned, 2nd Bn 1st Marines Fallujah AAR (Tier 1)
#   - Jane's Infantry Weapons (Tier 3)
#   - GlobalSecurity.org "SMAW-NE" (Tier 3; NE-round performance)

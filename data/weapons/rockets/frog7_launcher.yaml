# FROG-7 (9K52 Luna-M) Unguided Tactical Rocket Launcher
# Soviet short-range unguided artillery rocket on 9P113 TEL (ZIL-135 8x8).
# Single-rail launcher firing the 9M21 spin-stabilized rocket with ~450 kg
# HE fragmentation warhead. Highly inaccurate (CEP ~700 m at max range);
# used operationally for area saturation. At Khafji, Iraqi FROG batteries
# engaging the Saudi border were the target of AC-130H Spirit 03's final
# mission (dawn 31 Jan 1991) when the gunship was lost to IR-SAM fire.
# Sources:
#   - Jane's Strategic Weapon Systems, 9K52 Luna-M entry (Tier 3)
#   - GWAPS Vol. IV "Weapons, Tactics, and Training" (Tier 1)
#   - FM 100-2-3 "The Soviet Army: Troops, Organization, and Equipment" (Tier 1)

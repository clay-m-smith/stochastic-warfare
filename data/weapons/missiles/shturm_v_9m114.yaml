# Mi-24 Shturm-V launcher for the 9M114 / AT-6 Spiral.
#
# The U.S. Defense Intelligence-derived ATGM table identifies the helicopter
# AT-6V as radio-command SACLOS, with a 1,000-6,000 m envelope:
# https://man.fas.org/dod-101/sys/land/row/atgms.htm
# The DoD Mi-24 profile records two to twelve AT-6 rounds:
# https://man.fas.org/dod-101/sys/ac/row/mi-24.htm

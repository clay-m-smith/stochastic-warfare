# Four-station AIM-9L Sidewinder aircraft loadout boundary.
#
# The U.S. Air Force identifies the AIM-9L as the first all-aspect Sidewinder
# and publishes its infrared guidance and family physical envelope:
# https://www.af.mil/About-Us/Fact-Sheets/Display/Article/104557/aim-9-sidewinder/
# An official F-15 fact sheet records the period four-AIM-9 station load:
# https://www.eglin.af.mil/Portals/56/documents/history/AFD-141104-028.pdf
#
# Variant range is not released. The 18 km maximum is a conservative modeled
# legacy-family bound; capacity represents four aircraft stations rather than
# a hidden launcher magazine.

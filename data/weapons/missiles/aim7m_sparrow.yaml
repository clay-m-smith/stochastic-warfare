# Four-station AIM-7M Sparrow aircraft loadout boundary.
#
# The U.S. Air Force identifies the AIM-7M as a semi-active-radar air-to-air
# missile and an official F-15 fact sheet records four AIM-7 plus four AIM-9
# as the period loadout:
# https://www.af.mil/About-Us/Fact-Sheets/Display/Article/104575/aim-7-sparrow/
# https://www.eglin.af.mil/Portals/56/documents/history/AFD-141104-028.pdf
# NAVAIR's public Sparrow envelope provides up to 30 km:
# https://www.navair.navy.mil/product/Air-Intercept-Missile-AIM-7-Sparrow
#
# Capacity represents the authored aircraft's four missile stations, not a
# four-round magazine inside one rail.

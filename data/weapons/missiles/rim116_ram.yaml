# Mk 49 launcher with RIM-116B RAM Block 1A.
#
# The U.S. Navy publishes a 21-missile capacity, 5,201 kg loaded above-deck
# weight, 360-degree train, -25/+80 degree elevation, and the Block 1A's
# RF/IR guidance modes:
# https://www.navy.mil/Resources/Fact-Files/Display-FactFiles/Article/2168961/rim-116-rolling-airframe-missile-ram/
# A U.S. Navy carrier combat-systems account gives the operational 3-5
# nautical-mile range:
# https://www.navy.mil/DesktopModules/ArticleCS/Print.aspx?Article=2239841&ModuleId=523&PortalId=1
#
# The public 5-nautical-mile upper bound is modeled as 9,260 m. COMBINED
# records RF/IR guidance without pretending RAM is a gun CIWS or an unrelated
# SAM.

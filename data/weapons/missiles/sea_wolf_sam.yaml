# Conventional trainable six-round GWS-25 Sea Wolf launcher.
#
# UK Parliament identifies Sea Wolf as an automatic all-weather point-defense
# system protecting ships from missile and aircraft attack, and explicitly
# distinguishes the conventional trainable six-barrel launcher from VL Sea
# Wolf:
# https://publications.parliament.uk/pa/cm198889/cmhansrd/1989-02-28/Debate-1.html
# The bounded legacy GWS-25 missile envelope is 1-6 km and command guided:
# https://weaponsystems.net/system/1389-GWS-25%20Sea%20Wolf
#
# Public government material does not disclose a standalone launcher mass, so
# weight remains zero rather than copying the authored missile-item weight or
# inventing a different naval mount.

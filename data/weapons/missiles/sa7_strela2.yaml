# SA-7 Strela-2 (9K32) IR-Homing Shoulder MANPADS
# First-generation Soviet shoulder-fired surface-to-air missile. Passive IR
# seeker homes on hot engine exhaust (tail-aspect only). Defeated by flares,
# hot-exhaust deflectors, and all-aspect aircraft like later threats. Still
# widespread in Iraqi inventory at Khafji (1991). Credited — among other
# Iraqi IR-SAMs — with downing Spirit 03 (AC-130H) at dawn 31 Jan 1991
# after the gunship overstayed in its orbit engaging FROG-7 launchers.
# Sources:
#   - Jane's Land-Based Air Defence, 9K32 Strela-2 entry (Tier 3)
#   - NATO AAP-6 allied technical publications (Tier 1)
#   - JASP "Spirit of Survivability" AC-130 loss study, 2021 (Tier 1)
#   - GWAPS Vol. IV "Weapons, Tactics, and Training" (Tier 1)

# AGM-65 Maverick Air-to-Ground Guided Missile
# Family of standoff precision munitions with multiple seekers: AGM-65A/B
# (TV-guided, 57 kg WDU-20 HE), AGM-65D/G (imaging IR, 136 kg WDU-24 SAP),
# AGM-65E (semi-active laser). At Khafji, A-10s and F-16s launched Maverick
# D/G (IIR) against Iraqi armor; ~5,000 AGM-65s were fired in Desert Storm,
# most from A-10s, producing the highest air-to-ground Pk of the war.
# Sources:
#   - GWAPS Vol. IV "Weapons, Tactics, and Training" (Tier 1)
#   - Grant, Rebecca. "The War Report: Khafji" Air Force Magazine (Tier 2)
#   - Jane's Air-Launched Weapons, AGM-65 entry (Tier 3)

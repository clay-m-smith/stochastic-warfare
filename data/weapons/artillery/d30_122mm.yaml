# D-30 122mm Towed Howitzer (2A18)
# Soviet 122mm towed gun-howitzer with distinctive three-trail carriage
# allowing 360-degree traverse after emplacement. Standard Iraqi division
# artillery at Khafji. Fires OF-462 HE, HEAT-FS, illumination, and smoke
# to ~15 km. One of the most widely produced artillery pieces of the Cold
# War era.
# Sources:
#   - Jane's Armour and Artillery, D-30 entry (Tier 3)
#   - FM 100-2-3 "The Soviet Army: Troops, Organization, and Equipment" (Tier 1)
#   - TRADOC Soviet Artillery Weapons & Ammunition Handbook (Tier 1)

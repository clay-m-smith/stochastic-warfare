# S-68 57mm L/70 Autocannon (ZSU-57-2 armament)
# Soviet 57mm twin-mount autocannon derived from the S-60 towed AA gun.
# At the Battle of Debecka Pass (2003), ZSU-57-2s engaged ODA 392 GMVs in
# direct-fire ground role at ~2,000-3,000 m. Twin-barrel mount gives
# effective 240 rpm; per-barrel cyclic ~120 rpm. 4-round clip-fed loading.
# Represented here as the combined twin mount (single weapon instance).
# Sources:
#   - Jane's Armour and Artillery, ZSU-57-2 / S-60/68 entries (Tier 3)

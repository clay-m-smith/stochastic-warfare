# SPG-9 73mm Recoilless Rifle
# Soviet tripod-mounted 73mm recoilless gun. Iraqi insurgent heavy infantry
# weapon at 2nd Fallujah (Nov 2004) — used for building-to-building
# anti-vehicle and anti-bunker shots. Classed as ROCKET_LAUNCHER here to
# mirror the existing rpg7 pattern (spin-stabilised HEAT fin-stabilised round;
# no automatic-fire behaviour). PG-9V HEAT round; MV ~435 m/s; max 1,300m
# point / 6,000m area; min-arm ~100m; sustained 6 rpm; 47.5kg tripod+tube.
# Sources:
#   - Soviet SPG-9 TM (translated, via FAS) (Tier 3)
#   - Jane's Infantry Weapons — Mounted Weapons (Tier 3)
#   - DoD Worldwide Equipment Guide Vol. 1 (Tier 1)

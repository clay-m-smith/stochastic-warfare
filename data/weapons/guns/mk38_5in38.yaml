# 5"/38 Mk 12 Dual-Purpose Gun (Iowa-Class Secondary Battery)
# 5-inch/38-caliber dual-purpose gun in Mk 28 twin enclosed mounts. USS
# Missouri (BB-63) carried ten Mk 12 barrels in five twin mounts during
# Desert Storm, providing secondary naval gunfire support alongside the
# 16"/50 Mk 7 main battery. Mk 12 engaged coastal Iraqi targets near
# Khafji with HC (high-capacity) rounds.

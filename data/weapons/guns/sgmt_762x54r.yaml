# SGMT 7.62x54R tank machine gun.
#
# A U.S. Army Infantry magazine equipment table identifies the SGM as a
# 7.62x54R weapon with a 1,000 m effective envelope, 250 rounds/min practical
# rate, and 250-round belt:
# https://www.benning.army.mil/infantry/magazine/issues/1991/JAN-FEB/pdfs/JAN-FEB1991.pdf
# A current defense-supplier SGM(T) envelope publishes 10.24 kg, 600-700 rpm,
# 800 m/s, and 250/500-round feeds:
# https://vexcron.com/wp-content/uploads/2024/07/VEXCRON-COMPANY-PROFILE.pdf
#
# Because no accessible original SGMT manual was found, this definition is
# explicitly bounded to the overlapping government/supplier envelope:
# 1,000 m, 650 rpm, 800 m/s, and one 250-round belt.

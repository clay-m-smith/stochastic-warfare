# M197 20mm Three-Barrel Rotary Cannon
# Shortened (3-barrel) derivative of the M61 Vulcan used as the chin-turret
# gun of the USMC AH-1W SuperCobra. Fires 20x102mm ammunition from a linkless
# feed. At Khafji, AH-1W Cobras flew close air support for USMC and Saudi
# forces, strafing Iraqi armor with the M197 alongside TOW and Hellfire.

# DEFA 553 single 30mm aircraft cannon.
#
# KNDS identifies 30x113B ammunition as intended for DEFA weapons and
# publishes the 775 m/s ammunition envelope:
# https://knds.com/media/catalogue_munitions_85ae594873.pdf
# A published defense equipment guide bounds the DEFA 553 at
# 1,300 rounds/minute, 83 kg, and a 125-135-round aircraft installation:
# https://defenceweb.co.za/wp-content/uploads/Repository/A-Guide-to-the-SANDF/A-guide-to-the-SANDF-chapter-10-saaf-app-c-equipment.pdf
#
# This definition is one cannon and the lower 125-round published feed bound.
# An aircraft with two DEFA 553s must author two attachments rather than
# doubling a hidden proxy.

# 600-650-round/minute firing rate:
# https://www.boeing.com/content/theboeingcompany/us/en/defense/military-rotorcraft/ah-64-apache.html
#
# The burst and accuracy fields are conservative runtime abstractions; they do
# not assert a fixed Apache fire-control burst.

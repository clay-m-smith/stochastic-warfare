# Rheinmetall Rh-120 L/55 120mm smoothbore tank gun.
#
# The Bundeswehr identifies the Leopard 2A6's 120mm L55 and its 1.3 m barrel
# extension over L44:
# https://www.bundeswehr.de/de/ausruestung-technik-bundeswehr/kampfpanzer-leopard-versionen-bundeswehr
# Rheinmetall identifies the L55 and DM53 ammunition family, explaining that
# the longer barrel produces greater velocity and maximum range:
# https://www.rheinmetall.com/en/products/weapons-and-ammunition/large-calibre-weapons-and-ammunition
# A published Leopard 2A6 system profile reports a 5 km DM53 envelope and
# velocity above 1,750 m/s:
# https://www.army-technology.com/projects/leopard/
#
# Public penetration figures are not manufacturer-released acceptance data;
# the compatible round therefore labels its explicit conservative model bound.

# ADEN Mk 4/5 30mm aircraft revolver cannon.
#
# KNDS identifies 30x113B ADEN ammunition as qualified for ADEN Mk 4/Mk 5
# weapons and publishes its 2,000 m operational envelope:
# https://knds.com/media/catalogue_munitions_85ae594873.pdf
# The RAF Museum's conventional-weapons history describes ADEN as a revolver
# cannon with a firing rate above 1,000 rounds/minute:
# https://www.rafmuseum.org.uk/documents/Research/RAF-Historical-Society-Journals/Journal_45_Seminar_conventional_weapons.pdf
#
# This is one ADEN cannon and its 130-round Sea Harrier feed, not an aggregate
# two-gun installation. The runtime burst and accuracy are bounded modeling
# inputs.

# AC-130H Spectre 105mm M102 Howitzer (Gunship Side-Mount)
# M102 towed howitzer adapted for side-firing from the AC-130 gunship port.
# Manually loaded inside the aircraft; engages ground targets from a banking
# left-hand orbit at ~2-4 km slant range. Spirit 03 (AC-130H) was engaging
# Iraqi FROG-7 launchers at dawn on 31 Jan 1991 when lost to SA-7/SAM fire.
# Sources:
#   - GWAPS Vol. IV "Weapons, Tactics, and Training" (Tier 1)
#   - USAF AFSOC Spirit 03 incident reports (Tier 1)
#   - Jane's Weapon Systems, AC-130 entries (Tier 3)

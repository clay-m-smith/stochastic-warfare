# DShK 12.7mm Heavy Machine Gun (Dushka / "Daisy")
# 1938 Soviet heavy machine gun in 12.7x108mm. Widely used by Iraqi
# insurgents at 2nd Fallujah (Nov 2004), typically tripod-mounted or
# technical-mounted at window/rooftop positions. Belt-fed, 50-round links;
# 34kg gun + tripod. MV ~850 m/s; max effective 2,000m ground / 1,500m AA;
# cyclic ~600 rpm, sustained ~125 rpm.
# Sources:
#   - DoD Worldwide Equipment Guide Vol. 1 (Tier 1)
#   - Jane's Infantry Weapons (Tier 3)
#   - Soviet TM on DShK/DShKM (translated) (Tier 3)

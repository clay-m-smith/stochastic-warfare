# AC-130H 40mm Bofors L/60 Automatic Cannon (Gunship Side-Mount)
# Single-barrel Bofors 40x311mmR cannon (L/60 pattern) side-firing from the
# AC-130H. Used against soft and light-armor point targets in conjunction
# with the 105mm howitzer and 20mm Vulcan. Spirit 03 employed 40mm Bofors
# during its final mission against Iraqi armor near Khafji.

# Royal Navy 4.5-inch Mk 8 medium-range naval gun.
#
# The Royal Navy publishes 23.8 tonnes for the Mod 0 mount, approximately
# 25 rounds/minute, 22 km standard / 27.5 km HEER range, and 1973 entry:
# https://www.royalnavy.mod.uk/news/2016/april/01/160401-hms-collingwood-takes-delivery-of-gate-guard
# It separately publishes a 37 kg round and a five-second loading cadence:
# https://www.royalnavy.mod.uk/news/2018/august/07/180807-university-students-meet-the-navy-big-guns
#
# Public sources do not release a universal ready-feed count. The 22-round
# capacity is an explicit conservative runtime feed-ring allocation, not the
# ship's deep-magazine total. The standard-round 22 km envelope is used.

# YakB-12.7 (9-A-624) four-barrel aircraft machine gun.
#
# The Indian Air Force's Mi-35 ammunition project identifies the exact
# YakB-12.7 gun and its linked B-32/BZT-44 aircraft ammunition:
# https://makeinindiadefence.gov.in/upload/1/activity_file/1758085595.pdf
# The U.S. DoD Mi-24 profile publishes a 1,470-round load, practical 1,500 m
# range, and cyclic rate up to 4,500 rounds/minute:
# https://man.fas.org/dod-101/sys/ac/row/mi-24.htm
#
# The 40-round runtime burst is a bounded fire-control abstraction, not a
# claim that the full belt is fired continuously.

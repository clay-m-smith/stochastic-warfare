# GIAT/KNDS M693 20x139mm autocannon.
#
# KNDS publishes the M693's 20x139mm identity and 700 rounds/minute cyclic
# rate in its ARX 20 integration sheet:
# https://knds.com/media/NEX_214_2_VOL_ARX_20_EN_01_A_BDEF_0008785042.pdf
# KNDS also publishes the matching HEI round's 1,050 m/s velocity and
# approximately 2,000 m operational range:
# https://knds.com/en/products/ammunition/20x139-mm
# The U.S. Army WEG identifies the M693 as the AMX-30B2's coaxial autocannon:
# https://man.fas.org/dod-101/sys/land/row/weg2001.pdf
#
# The 480-round ready load is the authored AMX-30B2 installation boundary, not
# a universal magazine built into the cannon.

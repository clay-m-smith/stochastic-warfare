# USMC AH-1W SuperCobra attack helicopter
#
# Bell AH-1W tandem-seat (pilot + gunner) attack helicopter.
# USMC anti-armor CAS platform; at Khafji flown by HMLA-369 / HMLA-169
# detachments providing overhead anti-armor CAS against Iraqi armor
# columns 29-31 Jan 1991.
#
# Platform:
#   Crew 2 (pilot + gunner, tandem)
#   Max speed ~80 m/s (~295 km/h, ~160 kt)
#   Service ceiling ~5,500 m
#
# Armament (1991 era):
#   1x M197 20 mm 3-barrel rotary cannon in A/A1 turret (chin; 750 rds)
#   8x BGM-71 TOW-2 ATGM (4 per stub-wing pylon) — primary Khafji weapon
#   4x AGM-114 Hellfire (limited availability at Khafji; mostly TOW)
#   2.75" FFAR rocket pods (M260 7-tube or M261 19-tube)
#   AIM-9 Sidewinder A-A (limited deployment)
#
# Sensors:
#   M65 TOW sight — daylight telescopic optical sight. Early airborne TOW
#   lacked limited-visibility/night capability; AN/TAS-4 was a later,
#   separately authored thermal system:
#   https://history.redstone.army.mil/miss-tow.html
#
# Countermeasures:
#   AN/ALE-39 chaff/flare dispenser
#   AN/APR-39 radar warning receiver
#
# Sources:
#   Tier 1: Cureton, "U.S. Marines in the Persian Gulf, 1990-1991:
#           With the 1st Marine Division in Desert Shield and Desert
#           Storm" (History and Museums Div, USMC, 1993)
#   Tier 3: Jane's All the World's Aircraft 1990-91


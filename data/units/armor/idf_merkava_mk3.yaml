# Merkava Mk III Baz — IDF Main Battle Tank (Second Lebanon War, 2006)
#
# Merkava Mk III "Baz" (hebrew for "Falcon") — digital fire control
# upgrade of the base Mk III (introduced 1989, Baz upgrade rolled out
# from the mid-1990s). Served alongside the newer Mk IV during the
# Second Lebanon War (2006) and the Battle of Bint Jbeil. Older
# reservist-manned battalions of the 401st Armored Brigade and
# northern-command regional armor used predominantly Mk III Baz hulls;
# Mk IV distribution skewed to active-duty heavy brigades.
#
# Distinguishing Mk III Baz features (vs Mk IV):
#   - Same MG253 120mm smoothbore main gun (mapped under "M256 120mm
#     Smoothbore" alias for ammo compatibility).
#   - El-Op Gill fire control (earlier digital generation; 2nd-gen FLIR
#     vs the Mk IV's 3rd-gen).
#   - Modular composite armor — thinner than Mk IV; frontal ~700-800
#     mm RHA-eq vs HEAT (no dedicated reactive side packs standard).
#   - AVDS-1790-9AR turbocharged diesel, 1200 hp (vs 1500 hp on Mk IV).
#   - Amcoram LWS-2 Laser Warning Receiver (retrofitted in Baz
#     standard).
#   - FN MAG 7.62mm coaxial ("M240 7.62mm Coaxial" alias).
#   - 12.7mm M2HB roof MG and Soltam 60mm internal mortar (common
#     with Mk IV).
#   - Same 4-man crew (commander, gunner, driver, loader) and rear
#     dismount compartment.
#
# Sources:
#   - Matthews, Matt M. "We Were Caught Unprepared: The 2006 Hezbollah-
#     Israeli War" (CSI Long War Series Occasional Paper 26, 2008,
#     Tier 1) — reservist-heavy Mk III Baz presence in 2006 campaign.
#   - Cordesman, Anthony H. "Preliminary 'Lessons' of the Israeli-
#     Hezbollah War" (CSIS, September 2006, Tier 1) — armor mix.
#   - Jane's Armour and Artillery 2005-2006, Merkava Mk III Baz entry
#     (Tier 2) — armor spec, Gill FCS, powerpack.
#   - IDF Official Site / Israel MOD public factsheets, Merkava Mk 3
#     (Tier 1) — crew, speed, armament.


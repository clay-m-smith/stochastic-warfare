# LAV-AT Anti-Tank Variant (USMC)
# LAV-25 chassis fitted with the M901 Emerson TOW-2 twin-tube launcher
# (2 ready tubes, 13 total missiles stowed). Serves as the dedicated
# anti-armor element of the USMC Light Armored Infantry battalion. The
# AN/TAS-4 thermal sight integrated into the TOW turret provides
# night engagement capability.
#
# At Khafji (29-30 Jan 1991), two LAV-ATs of TF Shepherd were lost at
# Observation Post 4: one to fratricidal TOW fire (call sign "Green 2")
# and one to an AGM-65 Maverick from an A-10A Thunderbolt II ("Red 2"),
# killing seven Marines total — the costliest US loss of the battle.
#
# Sources:
#   - Cureton, Charles H. "U.S. Marines in the Persian Gulf, 1990-1991."
#     History and Museums Division, USMC, 1993 (Tier 1) — OP-4 fratricide.
#   - Westermeyer, Paul W. "U.S. Marines in Battle: Al-Khafji, 1991."
#     USMC History Division, 2014 (Tier 1) — LAV-AT role, casualties,
#     thermal sight significance at night.
#   - Jane's Armour and Artillery, 1990-91 (Tier 3) — LAV-AT technical
#     specifications.

# Cadillac Gage V-150 Commando (TOW Variant)
# 4x4 amphibious armored car — Saudi Arabian National Guard (SANG) primary
# mounted infantry platform in 1991. TOW-armed variant used for anti-armor
# overwatch by TF Abu Bakr (2nd SANG Bde: 7th, 5th, and 8th battalions) at
# the Battle of Khafji, 29 January – 1 February 1991.
#
# Sources:
#   - Westermeyer, Paul W. "U.S. Marines in Battle: Al-Khafji, 1991."
#     USMC History Division, 2014 (Tier 1) — SANG composition, V-150
#     employment, training baseline and performance.
#   - Jane's Armour and Artillery, 1990-91 (Tier 3) — technical
#     specifications (crew, armor, speed, armament, amphibious capability).

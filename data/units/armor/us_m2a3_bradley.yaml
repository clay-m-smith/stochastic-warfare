# M2A3 Bradley IFV — Army infantry fighting variant (TF 2-7 CAV, 1st Cav Div)
#
# Differs from data/units/infantry/m3a2_bradley.yaml:
#   - M3A2 is the cavalry scout variant (2 scouts, TOW ammo storage focus).
#   - M2A3 is the infantry-carrier variant with a 6-7 man dismount bay and
#     the IBAS (Improved Bradley Acquisition Subsystem): 2nd-gen FLIR thermal
#     plus a Commander's Independent Viewer (CIV) and FBCB2 digital display.
#   - Ground type is MECHANIZED_INFANTRY because it carries dismounts into the
#     fight (this was the primary Bradley employment inside Fallujah).
#
# Sources:
#   - Matthews, M.M. "Operation AL FAJR: A Study in Army and Marine Corps Joint
#     Operations" (CSI Occasional Paper, Tier 1 — names M2A3 TF 2-7 CAV usage).
#   - Estes, K.W. "U.S. Marines in Battle: Fallujah" (USMC HistDiv, Tier 1).
#   - Army-Guide M2A3 Bradley entry (Tier 3, technical specs).

unit_type: us_m2a3_bradley
domain: ground
display_name: "M2A3 Bradley IFV (TF 2-7 CAV)"
ground_type: MECHANIZED_INFANTRY
max_speed: 18.3  # m/s (~66 km/h road)

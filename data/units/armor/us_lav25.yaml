# LAV-25 Light Armored Vehicle (USMC, Standard 25mm Variant)
# 8x8 light armored vehicle built by General Dynamics Land Systems Canada.
# Primary platform of USMC Task Force Shepherd (1st Light Armored Infantry
# Battalion, Companies A/B/C/D) at the Battle of Khafji. Combines a 25mm
# Bushmaster chain gun with 1st-generation thermal gunsight — critical for
# detecting Iraqi armor in the night engagement at Observation Post 4.
#
# Sources:
#   - Cureton, Charles H. "U.S. Marines in the Persian Gulf, 1990-1991:
#     With the 1st Marine Division in Desert Shield and Desert Storm."
#     History and Museums Division, USMC, 1993 (Tier 1) — TF Shepherd
#     employment, OP-4 engagement, thermal sight performance.
#   - Westermeyer, Paul W. "U.S. Marines in Battle: Al-Khafji, 1991."
#     USMC History Division, 2014 (Tier 1) — LAV OOB and casualties.
#   - Jane's Armour and Artillery, 1990-91 (Tier 3) — LAV-25 specs.

# M1A2 SEP Abrams — Army variant (Task Force 2-7 CAV, 1st Cavalry Division)
#
# Differs from data/units/armor/m1a2.yaml by adding SEP (System Enhancement
# Program) upgrades actually employed at Fallujah (Operation Al-Fajr, Nov 2004):
#   - CITV (Commander's Independent Thermal Viewer): enables hunter-killer
#     engagement (commander scans 360 deg thermal while gunner engages).
#   - FBCB2 (Force XXI Battle Command Brigade & Below) digital tactical terminal.
#   - 2nd-gen FLIR in Gunner's Primary Sight (upgrade from 1st-gen on M1A1).
#   - Uprated armor package (~960 mm RHA equivalent frontal, Chobham + DU).
#
# Sources:
#   - Estes, K.W. "U.S. Marines in Battle: Fallujah" (USMC History Division,
#     Tier 1 — primary operational narrative naming TF 2-7 CAV M1A2 SEP employment).
#   - Matthews, M.M. "Operation AL FAJR: A Study in Army and Marine Corps Joint
#     Operations" (CSI Occasional Paper, Tier 1).
#   - DRS Technologies 2004 FBCB2 contract announcements (Tier 3).
#   - Army-Guide technical summary, M1A2 SEP entry (Tier 3).


# BRDM-2 Armored Scout Car (Iraqi Army)
# Soviet-designed 4x4 amphibious armored reconnaissance vehicle widely
# fielded by Iraqi mechanized and armored divisions. Employed in a
# reconnaissance and screening role during the Iraqi 5th Mechanized
# Division's advance on Khafji (29 January 1991).
#
# Sources:
#   - Westermeyer, Paul W. "U.S. Marines in Battle: Al-Khafji, 1991."
#     USMC History Division, 2014 (Tier 1) — Iraqi OOB and scheme of
#     maneuver for the Khafji incursion.
#   - Jane's Armour and Artillery, 1990-91 (Tier 3) — BRDM-2 technical
#     specifications (armament, armor, speed, amphibious capability).

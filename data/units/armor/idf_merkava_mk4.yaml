# Merkava Mk IV — IDF Main Battle Tank (Second Lebanon War, 2006)
#
# First combat use of the Merkava Mk IV during the Second Lebanon War
# (12 Jul – 14 Aug 2006), including the Battle of Bint Jbeil (24 Jul –
# 3 Aug 2006). Employed by the 401st Armored Brigade and attached
# to the Golani / 35th Paratrooper Brigade task forces. Notably the
# Mk IV was fielded WITHOUT the Trophy active protection system — Trophy
# did not achieve operational capability until 2009 (IDF Merkava-4M
# standard). Hezbollah ATGM (AT-14 Kornet, AT-5 Konkurs, AT-3 Sagger)
# teams scored dozens of mobility / mission kills during the campaign;
# Israeli post-war reviews attribute most penetrations to Kornet tandem-
# HEAT warheads against the side / rear aspect.
#
# Distinguishing Mk IV features modeled here:
#   - MG253 120mm smoothbore main gun (Israeli Military Industries) —
#     mapped under the "M256 120mm Smoothbore" alias for engine mapping
#     compatibility with existing 120mm ammo (M829A3 KE, M830A1 HEAT,
#     M908 HE-OR).
#   - El-Op "Knight" Mark 4 fire control with 3rd-gen FLIR, hunter-
#     killer engagement, and automatic target tracker.
#   - Amcoram LWS-2 Laser Warning Receiver (passive RWR for laser
#     designators / rangefinders — feeds TC for evasive maneuver).
#   - Modular composite armor ("special armor" blocks bolted to hull /
#     turret, swappable after damage) — frontal ~1000 mm RHA-eq vs
#     HEAT; side arrays include reactive armor packs.
#   - FN MAG 7.62mm coaxial (standard NATO round; mapped under
#     "M240 7.62mm Coaxial" for compat).
#   - 12.7mm M2HB roof machine gun (TC cupola).
#   - 60mm internal breech-loading mortar (Soltam) — indirect support
#     for infantry in defilade; limited rounds.
#   - AVDS-1790-9AR turbocharged diesel, 1500 hp (vs 1200 hp on Mk III).
#   - Engine forward (Merkava signature layout) — rear compartment
#     can carry 4-10 dismounts or stretcher casualties; flagged here
#     in equipment notes but not modeled as a separate transport slot.
#
# Sources:
#   - Matthews, Matt M. "We Were Caught Unprepared: The 2006 Hezbollah-
#     Israeli War" (CSI Long War Series Occasional Paper 26, 2008,
#     Tier 1) — Merkava Mk IV first combat use, ATGM engagement losses,
#     401st Armored Brigade Bint Jbeil employment.
#   - Cordesman, Anthony H. "Preliminary 'Lessons' of the Israeli-
#     Hezbollah War" (CSIS working draft, September 2006, Tier 1) —
#     armor deployment and kill breakdown.
#   - Harel, Amos and Avi Issacharoff. "34 Days: Israel, Hezbollah,
#     and the War in Lebanon" (Palgrave Macmillan, 2008, Tier 1) —
#     Merkava employment at Bint Jbeil and Wadi Saluki.
#   - Jane's Armour and Artillery 2005-2006, Merkava Mk IV entry
#     (Tier 2) — armor spec, sight suite, LWS, gun data.
#   - IDF Official Site / Israel MOD public factsheets, Merkava Mk 4
#     (Tier 1) — crew, speed, powerpack.


# M1064 Self-Propelled 120mm Mortar Carrier (organic to 2-7 CAV)
#
# M113-family APC chassis (armored aluminum hull, ~38 mm equivalent) mounting
# the M121 120mm mortar system. The mortar fires through a roof hatch from
# an internal turntable; crew loads manually. Max range ~7,200 m HE,
# rate-of-fire ~4-5 rpm sustained. Role at Fallujah was organic, responsive
# indirect-fire support to the maneuver company team — inside the range
# envelope where 155mm tube artillery was often held back by airspace and
# collateral-damage ROE.
#
# Sources:
#   - Matthews, M.M. "Operation AL FAJR: A Study in Army and Marine Corps
#     Joint Operations" (CSI Occasional Paper, Tier 1 — 2-7 CAV mortar
#     employment inside Fallujah).
#   - Jane's Armour and Artillery, M1064 entry (Tier 3, technical specs).


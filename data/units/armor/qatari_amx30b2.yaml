# AMX-30B2 Main Battle Tank (Qatari Armored Battalion)
# French AMX-30B2 upgrade fielded by Qatar's Armored Battalion attached to
# SANG at the Battle of Khafji. Features COTAC integrated fire control and
# the Castor thermal sight. Qatari tanks destroyed three T-55s and
# captured a fourth during the counterattack to retake Khafji (31 Jan 1991).
#
# Sources:
#   - Titus, James. "The Battle of Khafji: An Overview and Preliminary
#     Analysis." USAF Airpower Research Institute, DTIC ADA307954, 1996
#     (Tier 1) — Qatari force composition and combat performance.
#   - Westermeyer, Paul W. "U.S. Marines in Battle: Al-Khafji, 1991."
#     USMC History Division, 2014 (Tier 1) — coalition OOB.
#   - Jane's Armour and Artillery, 1990-91 (Tier 3) — AMX-30B2 technical
#     specifications (gun, armor, fire control, propulsion).

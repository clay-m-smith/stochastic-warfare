# ZSU-57-2 Self-Propelled Anti-Aircraft Gun
# Soviet twin 57mm S-68 autocannon on T-54 chassis. Optical sights only
# (no radar — this is the 57-2, not later radar-directed variants). At
# Debecka Pass (6 April 2003), Iraqi 1st Mechanized Infantry Division used
# the ZSU-57-2 in a DIRECT-FIRE ground role against ODA 392 on the ridge
# line at 1,500–3,000 m — not as an anti-air weapon.
#
# Sources:
#   - Briscoe, Kiper, Schroder, Sepp. "Weapon of Choice: U.S. Army Special
#     Operations Forces in Afghanistan." ARSOF Veritas v1n1 (Tier 1) —
#     Debecka Pass engagement, direct-fire suppression of the ridge.
#   - Jane's Armour and Artillery, ZSU-57-2 entry (Tier 3) — technical
#     specifications (crew, armor, speed, twin 57mm S-68 armament, ROF).

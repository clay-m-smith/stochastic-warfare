# D9 Armored Bulldozer — USMC urban breaching asset (Operation Al-Fajr)
#
# Caterpillar D9R/D9T earthmover fitted with an IDF-style armor kit (adopted
# by USMC engineers for Iraq urban operations). Gross weight ~60-65 tons
# (52 t base + armor + blade). Primary contribution is NOT gunnery: the
# blade and ripper shank break walls, plow roads through rubble, and open
# main supply routes under fire. Some hulls mount an M2 .50 for operator
# self-defense; it is a secondary capability and not represented here.
#
# At Fallujah the D9s worked directly with engineer squads and Marine
# infantry to defeat the dense wall-and-alley urban pattern — they cleared
# rubble MSRs and knocked down reinforced compound walls rather than
# assaulting buildings by fire.
#
# Sources:
#   - Marine Corps Gazette, "Bulldozers to Baghdad" (Tier 1 — Marine operator
#     employment doctrine for armored D9).
#   - Estes, K.W. "U.S. Marines in Battle: Fallujah" (USMC HistDiv, Tier 1).


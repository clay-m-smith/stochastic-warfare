# Iowa-class Battleship (BB-61/62/63/64) — 1991 modernized configuration
#
# Canonical platform for USS Missouri (BB-63), USS Wisconsin (BB-64),
# USS Iowa (BB-61), and USS New Jersey (BB-62). Scenario overrides set
# the display_name for a specific hull (e.g., "USS Missouri (BB-63)" at
# Battle of Khafji, 27 Jan – 6 Feb 1991).
#
# NavalUnitType note: the engine enum lacks BATTLESHIP; CRUISER is the
# closest available category (next-largest surface combatant after CARRIER).
#
# Platform (post-1980s reactivation / modernization):
#   Length 270 m, beam 33 m, draft 11.6 m
#   Full-load displacement ~57,500 t
#   Max speed ~15 m/s (~33 kn)
#   Crew ~1,850 (modernized; ~2,700 in WW2)
#   Armor: 12.1 in (~305 mm) belt, 17 in (~432 mm) turret faces
#
# Armament (1991):
#   9x 16"/50 Mark 7 guns in 3x triple turrets (main battery; WW2 era;
#     used at Khafji — first 16"/50 combat shots since Korea 1953)
#   12x 5"/38 Mark 12 in 6x twin Mk 28 mounts (secondary)
#   32x BGM-109 Tomahawk in 8x Armored Box Launchers (ABL)
#   16x RGM-84 Harpoon in 4x quad Mk 141 launchers
#   4x Mk 15 Phalanx CIWS (20 mm gatling)
#   No torpedoes (obsolete on Iowa-class by 1991)
#
# Sensors/EW:
#   SPS-49 2D air search, SPS-67 surface search
#   Mk 38 GFCS (16"/50) with Mk 13 fire-control radars
#   Mk 37 GFCS (5"/38) with Mk 25 radars
#   SLQ-32(V)3 EW suite
#   No effective hull sonar
#
# Aviation:
#   1x RQ-2 Pioneer UAV detachment for NGFS spotting (first UAV combat
#   employment at Khafji). Helo deck supports SH-60B but no routine
#   embark during 1991.
#
# Use at Khafji: gun line 27 Jan – 6 Feb; C2 bunker + artillery
# suppression + area fire; ~30–60 rounds during main battle.
#
# Sources:
#   Tier 1: NHHC DANFS, "Missouri III (BB-63)"
#   Tier 1: Gulf War Air Power Survey (GWAPS) Vol II (naval fires summary)
#   Tier 3: Jane's Fighting Ships 1990-91


  - role: COMMANDER
    count: 1
    skill: EXPERIENCED
  - role: RIFLEMAN
    count: 7
    skill: TRAINED
  - role: GUNNER
    count: 2  # Negev LMG gunners (one per fire team)
    skill: TRAINED

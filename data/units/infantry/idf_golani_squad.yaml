# IDF Golani Brigade Rifle Squad (10-man) — Second Lebanon War, 2006
#
# Golani Brigade (Brigade 1, "HaGolani") is one of the IDF's five regular
# infantry brigades. Its 51st Battalion led the assault into Bint Jbeil
# on 24-26 July 2006 and suffered heavy casualties in the engagement
# known in Israel as "The Battle at the Saraya" (Bint Jbeil town hall),
# where deputy battalion commander Maj. Roi Klein was killed along with
# seven others in a Hezbollah ATGM / small-arms ambush. Golani squads
# in 2006 operated in the standard 10-man configuration (squad leader
# plus two four-man fire teams, sometimes task-organized into three
# smaller teams in urban clearance).
#
# Equipment reflects 2006 IDF standard:
#   - Tavor TAR-21 bullpup as primary rifle (general issue from 2003;
#     fully distributed to Golani by 2006). Integrated Meprolight red-
#     dot sight standard.
#   - IMI Negev 5.56mm light machine gun × 2 (one per fire team;
#     replaced older FN MAG-based sections in the LMG role).
#   - FN MAG 7.62mm general-purpose machine gun × 1 (support role;
#     mapped under "M240 7.62mm" for mapping compatibility with the
#     NATO 7.62x51mm family).
#   - M203 40mm Grenade Launcher × 2 (under-barrel on alternating
#     Tavors in each fire team).
#   - IMI Rabintex / Rafael ballistic vest (Level III soft + plates).
#   - AN/PVS-14 monocular NVG (US-procured, widely fielded by 2006).
#   - Israeli tactical radio (IDF "Rakevet" squad net — mapped under
#     AN/PRC-148 alias for NATO-comparable squad radio).
#
# Sources:
#   - Matthews, Matt M. "We Were Caught Unprepared: The 2006 Hezbollah-
#     Israeli War" (CSI Occasional Paper 26, 2008, Tier 1) — Golani
#     51st Bn task organization, Bint Jbeil assault composition.
#   - Harel, Amos and Avi Issacharoff. "34 Days: Israel, Hezbollah,
#     and the War in Lebanon" (Palgrave Macmillan, 2008, Tier 1) —
#     Saraya battle narrative, squad tactics, casualty reports.
#   - Cordesman, Anthony H. "Preliminary 'Lessons' of the Israeli-
#     Hezbollah War" (CSIS, September 2006, Tier 1) — IDF infantry
#     equipment and small-arms inventory.
#   - IDF Ground Forces Command factsheets, Golani Brigade organization
#     (Tier 1) — squad size and structure.
#   - Jane's Infantry Weapons 2005-2006, Tavor TAR-21 and IMI Negev
#     (Tier 2) — individual weapon specifications.


# USMC Rifle Squad — Urban / Fallujah Loadout (Operation Al-Fajr, Nov 2004)
#
# 13-man squad in the USMC urban configuration used during Phase 101
# Battle of Fallujah (Operation Al-Fajr, 9-13 November 2004). Differs from
# the generic us_rifle_squad: M16A4 as primary rifle (with ACOG 4x),
# Mk 153 SMAW at squad level for bunker / fortified-room reduction,
# Benelli M1014 shotgun for door breaching, and AT-4 LAWs distributed
# through the fire teams. Post-April-Fallujah lessons drove deliberate
# urban-combat adaptation; training_level 0.80 reflects USMC line
# infantry baseline with urban refresher.
#
# Organization:
#   1 squad leader (M4A1 SOPMOD)
#   3 fire teams x 4 Marines each:
#     - team leader (M16A4 + M203 grenadier alternating)
#     - rifleman / grenadier (M16A4 + M203 UGL)
#     - automatic rifleman (M249 SAW)
#     - rifleman (M16A4)
#
# Sources:
#   - Estes, Kenneth W. "U.S. Marines in Iraq, 2004-2005: Into the Fray."
#     USMC History Division, 2011 (Tier 1) — squad composition, urban
#     loadouts, Mk 153 SMAW employment, shotgun breachers in Al-Fajr.
#   - MCWP 3-35.3, "Military Operations on Urbanized Terrain (MOUT),"
#     USMC, 1998 (Tier 1) — squad urban TTPs.
#   - Camp, Dick. "Operation Phantom Fury: The Assault and Capture of
#     Fallujah, Iraq." Zenith Press, 2009 (Tier 2) — 3/5 and 3/1 urban
#     squad employment, SMAW / AT-4 expenditure.
#   - Marine Corps Association, "3/5 Darkhorse in Fallujah," Marine Corps
#     Gazette Part II, 2005 (Tier 3) — cross-ref for loadout.

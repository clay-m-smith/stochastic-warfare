# US Army TF 2-7 CAV Dismounted Infantry Squad — Operation Al-Fajr, Nov 2004
#
# 9-man mechanized infantry squad drawn from 2nd Battalion, 7th Cavalry
# Regiment (1st Cavalry Division), one of two Army mechanized task forces
# attached to Regimental Combat Teams 1 and 7 for Operation Al-Fajr.
# Dismounts from M2A3 Bradley; operated in direct coordination with
# M1A2 SEP tanks. Organization reflects the standard Army IN squad of
# the period: squad leader + two fire teams (alpha/bravo) of 4 each.
#
# Organization:
#   1 squad leader (M4A1)
#   2 fire teams x 4 soldiers:
#     - team leader (M4A1)
#     - automatic rifleman (M249 SAW)
#     - grenadier (M4A1 + M203 UGL)
#     - rifleman / AT specialist (M4A1, carries AT-4)
#   M240B GPMG fires from Bradley or attached at platoon level.
#   Javelin CLU kept at platoon level (limited rounds, shared).
#
# Sources:
#   - Matthews, Matt M. "Operation AL FAJR: A Study in Army and Marine
#     Corps Joint Operations." Combat Studies Institute Press, Fort
#     Leavenworth, 2006 (Tier 1) — TF 2-7 CAV composition, employment,
#     Army-Marine joint ops.
#   - Estes, Kenneth W. "U.S. Marines in Iraq, 2004-2005: Into the
#     Fray." USMC History Division, 2011 (Tier 1) — Army task force
#     integration into RCT battlespace.
#   - FM 3-21.8, "The Infantry Rifle Platoon and Squad," US Army, 2007
#     (Tier 1) — squad composition baseline.

# Saudi Arabian National Guard (SANG) Dismounted Infantry Section
# Roughly 10-man section from SANG light/motorized infantry. Trained by
# the Vinnell Corporation under US DoD contract; by 1991 training was
# decent but combat experience was limited. Fought dismounted alongside
# V-150 mounted elements of TF Abu Bakr at Khafji (29 Jan - 1 Feb 1991),
# clearing the town block-by-block during the counterattack.
#
# Sources:
#   - Westermeyer, Paul W. "U.S. Marines in Battle: Al-Khafji, 1991."
#     USMC History Division, 2014 (Tier 1) — SANG training pipeline,
#     unit composition, performance in the Khafji counterattack.
#   - Titus, James. "The Battle of Khafji: An Overview and Preliminary
#     Analysis." USAF Airpower Research Institute, DTIC, 1996 (Tier 1).

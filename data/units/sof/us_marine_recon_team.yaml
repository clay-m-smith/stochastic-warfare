# USMC Marine Reconnaissance Stay-Behind Team (6-Man)
# Six-man reconnaissance element drawn from 1st Force Reconnaissance
# Company and 1st Reconnaissance Battalion. During the Battle of Khafji
# (29 Jan - 1 Feb 1991), two such teams (Corporal Ingraham's and Captain
# Lentz's) were trapped inside the town when Iraqi forces overran it.
# Operating from rooftop hides, the teams directed coalition close air
# support and artillery fires onto Iraqi armor and infantry in the
# streets below for roughly 36 hours — a decisive fire-control role.
#
# Equipment reflects a tailored stay-behind loadout: standard rifles
# plus precision long-range fires (M40A1 7.62 sniper, Barrett M82A1 .50
# anti-materiel) and the AN/TVQ-2 MULE laser designator for guided
# munitions terminal homing. The MULE is modeled here under the
# "Multi-Function Sensor Suite" alias, which maps to a thermal sight
# sensor_id for LOS and designation purposes.
#
# Sources:
#   - Westermeyer, Paul W. "U.S. Marines in Battle: Al-Khafji, 1991."
#     USMC History Division, 2014 (Tier 1) — recon team composition,
#     stay-behind mission, fire direction from rooftops, equipment.
#   - Cureton, Charles H. "U.S. Marines in the Persian Gulf, 1990-1991."
#     History and Museums Division, USMC, 1993 (Tier 1) — cross-reference
#     on recon employment and CAS coordination.

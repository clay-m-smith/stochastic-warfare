    category: WEAPON
    weight_kg: 1496.0
    reliability: 0.88
  - name: "AN/AAQ-17 FLIR"
    category: SENSOR
    weight_kg: 180.0
    reliability: 0.86
  - name: "AN/AVQ-19 Low-Light-Level TV"
    category: SENSOR
    weight_kg: 120.0
    reliability: 0.84
  - name: "AN/ASQ-145 Beacon Tracker"
    category: SENSOR
    weight_kg: 50.0
    reliability: 0.85
  - name: "AN/ALR-69 RWR"
    category: SENSOR

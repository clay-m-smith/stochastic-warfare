# F/A-18C Hornet — US Navy / US Marine Corps multirole strike fighter
#
# Single-seat C variant (D is two-seat). Carrier or land based. At Debecka
# Pass (Apr 2003) an F/A-18 pair arrived after the F-14B friendly-fire
# incident and delivered precision-guided bombs to drive off the remaining
# Iraqi T-55s threatening ODA 391. The Hornet's AN/APG-73 radar paired with
# an AAQ-28 LITENING or AAQ-14 LANTIRN targeting pod enables laser
# designation of GBU-12/16 and JDAM delivery (GBU-31/32/38).
#
# Sources:
#   - Tier 1: Briscoe et al., "All Roads Lead to Debecka," ARSOF Veritas v1n1
#             (US Army Special Operations Command historical journal)
#   - Tier 2: Carlo Kopp, "Operation Iraqi Freedom Air Power Analysis,"
#             Australian Aviation, June 2003
#   - Tier 3: Jane's All the World's Aircraft (airframe / sensor specs)

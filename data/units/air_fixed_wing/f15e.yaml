# F-15E Strike Eagle — USAF dual-role air-to-ground / air-to-air fighter
#
# McDonnell Douglas two-seat (pilot + WSO) derivative of the F-15 with
# conformal fuel tanks carrying tangential weapons stations. Primary
# air-to-ground sensor suite in 1991 was LANTIRN — AN/AAQ-13 navigation
# pod (terrain-following radar + wide-FOV FLIR) and AN/AAQ-14 targeting
# pod (narrow-FOV FLIR + laser designator/rangefinder). Radar is the
# AN/APG-70 with air-to-ground mapping and synthetic aperture modes.
# At Khafji (29 Jan – 1 Feb 1991) F-15Es from the 4th TFW (Provisional)
# based at Al Kharj AB were among the first LANTIRN-equipped strike
# aircraft to detect and attack the Iraqi III Corps columns at night;
# two F-15Es were repositioned onto OP-4 during the opening engagement
# per Grant 1998.
#
# Sources:
#   - Tier 1: GWAPS Vol II Pt II "Effects and Effectiveness" — F-15E
#             night strike sorties during Khafji
#   - Tier 2: Rebecca Grant, "The Epic Little Battle of Khafji,"
#             Air Force Magazine, Feb 1998
#   - Tier 3: Jane's All the World's Aircraft (airframe / sensor specs)

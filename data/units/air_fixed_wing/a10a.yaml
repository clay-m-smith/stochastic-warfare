# A-10A Thunderbolt II — USAF daylight close air support (CAS) aircraft
#
# Fairchild Republic single-seat, twin-engine, armored attack aircraft built
# around the GAU-8/A 30mm Avenger cannon. During the Battle of Khafji
# (29 Jan – 1 Feb 1991) A-10A flights from the 23rd TFW (Provisional)
# operating out of King Fahd IAP delivered sustained daylight CAS against
# the Iraqi III Corps mechanized columns attempting to exploit the Khafji
# penetration. The 1991 A-model predates the A-10C upgrade — it lacks an
# internal FLIR/thermal sight; target acquisition is via Mk 1 Eyeball and
# the AN/AAS-35 Pave Penny laser spot tracker (passive receive-only; the
# lasing is done by a ground FAC, OV-10 Bronco, or another aircraft).
#
# Sources:
#   - Tier 1: GWAPS Vol II Pt II "Effects and Effectiveness" — Khafji CAS
#             sortie counts and target engagement
#   - Tier 2: Rebecca Grant, "The Epic Little Battle of Khafji,"
#             Air Force Magazine, Feb 1998
#   - Tier 3: Jane's All the World's Aircraft (airframe / sensor specs)

# AV-8B Harrier II — USMC V/STOL ground-attack aircraft
#
# McDonnell Douglas (later Boeing) second-generation Harrier, single-seat,
# with a GAU-12 Equalizer 25mm rotary cannon in a belly pod and 7 external
# hardpoints. Primary air-to-ground sensor is the Hughes Angle Rate Bombing
# System (ARBS) — a dual-mode TV/laser spot tracker combined with a weapon-
# release computer. During the Battle of Khafji (29 Jan – 1 Feb 1991)
# AV-8Bs from VMA-231, VMA-311, VMA-542 and VMA-331 operated from King
# Abdul Aziz Air Base and LHA-4 USS Nassau offshore, delivering Mk 20
# Rockeye CBUs and AGM-65E (laser) Mavericks against the Iraqi armored
# columns pushing on Khafji and OP-4. The type flew roughly 25% of all
# Marine fixed-wing sorties during the engagement.
#
# Sources:
#   - Tier 1: Cureton, "U.S. Marines in the Persian Gulf 1990–1991 — With
#             the 1st Marine Division in Desert Shield and Desert Storm"
#             (USMC History & Museums Division, 1993)
#   - Tier 2: Westermeyer, "U.S. Marines in Battle: Al-Khafji"
#             (USMC History Division, 2014)
#   - Tier 3: Jane's All the World's Aircraft (airframe / sensor specs)

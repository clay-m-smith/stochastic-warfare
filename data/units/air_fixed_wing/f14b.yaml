# F-14B Tomcat — US Navy carrier-based supersonic interceptor / precision strike
#
# Variant note: F-14B (GE F110-powered upgrade of F-14A), NOT F-14D. The F-14A
# was retired; at Debecka Pass (Apr 2003) VF-32 "Swordsmen" off USS Harry S.
# Truman (CVN-75) flew F-14Bs equipped with LANTIRN targeting pods. The F-14B
# retains the AWG-9 fire control (not the APG-71 of the F-14D). A VF-32 F-14B
# delivered the GBU-16 Paveway II LGB involved in the friendly-fire incident
# on ODA 391's position.
#
# Sources:
#   - Tier 1: Briscoe et al., "All Roads Lead to Debecka," ARSOF Veritas v1n1
#             (US Army Special Operations Command historical journal)
#   - Tier 2: Carlo Kopp, "Operation Iraqi Freedom Air Power Analysis,"
#             Australian Aviation, June 2003
#   - Tier 3: Jane's All the World's Aircraft (airframe / sensor specs)

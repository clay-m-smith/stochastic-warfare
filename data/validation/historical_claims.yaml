- claim_id: docs.models.joint-success-formula
  repository_path: docs/concepts/models.md
  scenario_path: null
  surface: documentation_claim
  locator:
    kind: required_text
    text: 'For a historical study, let $I_{m,i}$ be the strict in-source-range boolean

      for gating metric $m$ on held-out run $i$. A run succeeds only when every

      gating metric succeeds:


      $$

      J_i = \bigwedge_m I_{m,i}, \qquad k = \sum_{i=1}^{n} J_i

      $$


      The evaluator uses the exact one-sided Clopper--Pearson lower bound at declared

      confidence $c$:


      $$

      L =

      \begin{cases}

      0, & k = 0 \\

      F^{-1}_{\mathrm{Beta}(k,\,n-k+1)}(1-c), & k > 0

      \end{cases}

      $$'
    expected_occurrences: 1

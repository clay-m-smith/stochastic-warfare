  repository_path: docs/reference/api.md
  scenario_path: null
  surface: documentation_claim
  locator:
    kind: required_text
    text: '| API | Contract |

      |---|---|

      | `HistoricalClaimLedgerLoader(root).load(path)` | Verify the ledger self-digest, exact claim locator/content
      binding, semantic matched-span review inventory, and accepted evidence |

      | `HistoricalClaimLedgerLoader(root).load_scenario_catalog(path)` | Load the full checkout ledger
      while source-auditing every API-published scenario claim |

      | `HistoricalClaimLedgerLoader(root).load_packaged_scenario_catalog(path)` | Verify the full packaged
      ledger receipt before projecting its scenario-only review/claim set; the current no-docs/no-tests
      package supports the zero-accepted ledger and fails closed on a future accepted reference until
      REM-048 |

      | `HistoricalStudyLoader(root).load(path)` | Validate the typed source lineage, claim/metric scopes,
      event boundaries, seeds, runtime inputs, and acceptance policy |

      | `HistoricalBacktestRunner(prepared, plan).run()` | Build every seed from one `PreparedScenario`,
      retain typed terminal/metric receipts and ordered vectors, then return the exact evaluation and
      eligibility reasons |

      | `evaluate_joint_coverage(...)` | Form the per-seed conjunction of all gating metrics and apply
      the exact one-sided Clopper--Pearson lower bound |


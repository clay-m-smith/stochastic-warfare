  scenario_path: null
  surface: documentation_claim
  locator:
    kind: required_text
    text: "Historical acceptance is a separate typed pipeline over the production runtime:\n\n```text\n\
      historical_claims.yaml\n  -> HistoricalClaimLedgerLoader\n  -> HistoricalStudyLoader / HistoricalStudyPlan\n\

- claim_id: docs.remediation-backlog.rem048-deficit-and-contract
  repository_path: docs/remediation-backlog.md
  scenario_path: null
  surface: documentation_claim
  locator:
    kind: required_text
    text: "## REM-048 - Packaged accepted evidence lacks a no-Git attestation boundary\n\n### Phase 117\
      \ finding and current safe behavior\n\nThe repository `HistoricalClaimLedgerLoader` verifies accepted\
      \ evidence by\nchecking Git ancestry, reading the execution ledger at the artifact's commit,\nchecking\
      \ code/dependency drift, reloading the committed plan, and freshly\npreparing the production scenario.\
      \ The production Docker image intentionally\ncontains neither `.git` nor `docs/`; accepted artifacts\
      \ are currently retained\nunder `docs/evidence/`. Therefore a future nonempty `accepted_evidence`\
      \ entry\ncannot pass the same loader inside that image.\n\nThe Phase 117 local packaged-loader control\
      \ remains truthful and useful: the\ncurrent ledger has zero `production_validated` claims, so the\
      \ packaged loader\naudits every scenario claim it can publish and exposes 73 Easting as\nunsupported\
      \ with current-engine regression evidence. A hosted no-`.git` image\nsmoke is configured. The Phase\
      \ 117 push prerequisite is satisfied at\n`84cf4c4`, but no successful hosted result is recorded\
      \ in the repository, so\nthat smoke remains unverified pending a successful workflow run. Neither\
      \ the\nlocal control nor that zero-accepted smoke exercises or establishes packaged\naccepted-evidence\
      \ support. Silently bypassing Git verification,\ncopying an artifact without an attestation, or\
      \ treating the build's source\nrevision string as the entire proof would weaken the repository contract.\n\
      \n**Matrix:** `D=Yes, L=Yes, W=Yes, E=N/A, X=-, O=Yes, P=-`. The accepted\nreference and verification\
      \ schemas are declared, loaded, and reached by the\npackaged API, and the missing Git/evidence boundary\
      \ fails closed observably.\nReal nonempty package execution and durable package-bound proof are\
      \ absent.\n`E` is N/A because accepted evidence is a disposition, not a runtime feature\ntoggle.\n\
      \n### Required proof\n\n- At image build time, run the complete repository/Git accepted-evidence\n\
      \  verification before `.git` is discarded. Produce a strict canonical receipt\n  that binds the\
      \ accepted claims to the exact source revision and source\n  manifest, execution and current ledgers,\
      \ plans, artifacts, source\n  references, metric bindings, and production-input identities.\n- Package\
      \ every evidence input required for independent runtime verification\n  at one canonical non-documentation\
      \ boundary. Reject aliases, symlinks,\n  missing or extra files, digest drift, wrong revisions,\
      \ stale receipts, and a\n  receipt copied from another image.\n- Keep repository and packaged verification\
      \ semantically equivalent. A\n  no-`.git` runtime may verify the build-time receipt, but may not\

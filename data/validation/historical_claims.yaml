- claim_id: docs.remediation-backlog.rem047-finding-and-contract
  repository_path: docs/remediation-backlog.md
  scenario_path: null
  surface: documentation_claim
  locator:
    kind: required_text
    text: "## REM-047 - 73 Easting misses the source-synchronous engagement signature\n\n### Phase 117\
      \ finding and nonclaim\n\nThe corrected Phase 117 study observes the shipped 73 Easting scenario\
      \ at the\nsource's 1,380-second Eagle Troop boundary across held-out seeds 11700 through\n11719.\
      \ All 20 production runs recorded zero destroyed scoped Iraqi tanks\nagainst the exact 28-tank range\
      \ and zero destroyed scoped Iraqi personnel\ncarriers against the exact 16-carrier range. All 20\
      \ retained the\nsource-consistent zero destroyed American vehicles and reached the study\ncutoff\
      \ without a natural terminal result. The complete joint outcome therefore\nsucceeded in 0/20 runs,\
      \ with an exact lower confidence bound of 0.0; the\ndiagnostic terminal labels were 16 draws and\
      \ four red wins.\n\nThis persisted `FAIL` is valid evidence that the current authored scenario and\n\
      production behavior do not reproduce the frozen source-scoped signature. It\ndoes not identify the\
      \ first causal defect, prove that one subsystem is solely\nresponsible, or authorize post-result\
      \ changes to the study. Phase 117 closed\nREM-030 by publishing this truthful unsupported classification\
      \ and retaining\nthe complete failure artifact. REM-047 is a separate fidelity remediation and\n\
      does not require Phase 117 to manufacture a passing historical claim.\n\n**Matrix:** `D=Yes, L=Yes,\
      \ W=Yes, E=N/A, X=Yes, O=Yes, P=Yes`. These entries\ndescribe the strict study declaration, loaded\
      \ production scenario, exercised\ndetection-to-terminal path, observable miss, and persisted failure\
      \ evidence;\nthey do not assert that the missing source-synchronous fidelity is correct.\n`E` is\
      \ N/A because causal integrity and fidelity are not an optional runtime\ntoggle.\n\n### Required\
      \ proof\n\n- Record a deterministic, source-synchronous causal trace from deployment and\n  visibility\
      \ through detection, contact/fusion, targeting and fire-control,\n  movement/standoff, engagement,\
      \ hit/damage, authoritative destruction, and\n  victory/termination. Identify the first unsupported\
      \ or incorrect transition\n  before changing production behavior.\n- Distinguish scenario-scope\
      \ or force-representation errors from detection,\n  targeting, engagement/effects, destruction-accounting,\
      \ and event-boundary\n  defects. Correct only source- and model-backed causes through their\n  authoritative\
      \ production owners; a proxy event, scripted casualty, or\n  validation-only override is not a repair.\n\
      - Preserve the frozen 20-seed interval; separate exact loss gates for 28 Iraqi\n  tanks, 16 Iraqi\
      \ personnel carriers, and zero American scoped vehicles; the\n  exact 1,380-second natural-duration\
      \ gate; observation semantics; and the\n  joint acceptance rule. Do not recombine the Iraqi components,\
      \ widen a\n  casualty or duration range, select favorable seeds, relax right-censoring,\n  change\
      \ a victory threshold merely to hit 23 minutes, or tune physical weapon,\n  sensor, morale, or damage\
      \ parameters to force agreement.\n- Make any natural action boundary arise from typed production\
      \ objectives and\n  state transitions with authoritative logical time. An unconditional timer,\n\
      \  fabricated terminal cause, or study-cutoff relabel is not a natural result.\n- Prove realistic\
      \ enabled/disabled or causal negative controls where\n  applicable, exact same-seed replay, and\
      \ fresh/in-place continuation for every\n  changed state owner. Re-run affected catalog scenarios\
      \ and explain every\n  semantic delta rather than treating a 73 Easting match as permission for\n\
      \  unrelated regressions.\n- Re-run the unchanged frozen study through `SimulationRuntimeFactory`\
      \ and\n  retain complete receipts and a reload-validated artifact. REM-047 closes\n  only with a\
      \ production-causal result satisfying the complete frozen joint\n  gate and all applicable phase\
      \ reviews; if the investigation instead finds an\n  unrepresentable or differently scoped historical\
      \ claim, retain or split the\n  numbered deficit rather than redefining success.\n\n**Status:**\
      \ Queued for Phase 134 in Block 18. A future pass of this reused-source\nstudy would not by itself\
      \ promote the claim to `production_validated`; Phase\n117's independence and intended-use restrictions\
      \ remain in force."
    expected_occurrences: 1

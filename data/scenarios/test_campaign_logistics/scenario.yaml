name: "Test Campaign - Supply Chain Emphasis"
date: "2024-06-15T08:00:00Z"
duration_hours: 72
latitude: 32.0
longitude: 44.0

tick_resolution:
  strategic_s: 3600
  operational_s: 300
  tactical_s: 5

weather_conditions:
  visibility_m: 10000
  wind_speed_mps: 4.0
  temperature_c: 38.0

terrain:
  width_m: 30000
  height_m: 15000
  cell_size_m: 100
  terrain_type: "flat_desert"

deployment:
  mode: "bounding_box"
  blue_box: {x_min: 500, y_min: 6500, x_max: 3500, y_max: 8500}
  red_box: {x_min: 26500, y_min: 6500, x_max: 29500, y_max: 8500}
  min_spacing_m: 100
  min_side_separation_m: 20000

sides:
  - side: "blue"
    units:
      - unit_type: "m1a2"
        count: 4
    experience_level: 0.7
    morale_initial: "STEADY"
    commander_profile: "balanced_default"
    doctrine_template: "us_combined_arms"
    depots:
      - depot_id: "blue_main_depot"
        position: [500, 7500]
        depot_type: "DEPOT"
        condition: 1.0
        capacity_tons: 1000
        throughput_tons_per_hour: 100
        initial_inventory:
          - supply_class: "CLASS_I"
            item_id: "water_potable"
            quantity: 20000
      - depot_id: "blue_forward_depot"
        position: [3000, 7500]
        depot_type: "SUPPLY_POINT"
        condition: 1.0
        capacity_tons: 200
        throughput_tons_per_hour: 30
        initial_inventory:
          - supply_class: "CLASS_I"
            item_id: "water_potable"
            quantity: 5000

  - side: "red"
    units:
      - unit_type: "m1a2"
        count: 5
    experience_level: 0.5
    morale_initial: "STEADY"
    commander_profile: "cautious_infantry"
    doctrine_template: "russian_deep_operations"
    depots:
      - depot_id: "red_depot"
        position: [29500, 7500]
        depot_type: "DEPOT"
        condition: 1.0
        capacity_tons: 800
        throughput_tons_per_hour: 60
        initial_inventory:
          - supply_class: "CLASS_I"
            item_id: "water_potable"
            quantity: 15000

logistics:
  enabled: true
  update_interval_seconds: 3600
  unit_profiles:
    - side: "blue"
      unit_type: "m1a2"
      initial_inventory:
        - supply_class: "CLASS_I"
          item_id: "water_potable"
          quantity: 20
      maximum_inventory:
        - supply_class: "CLASS_I"
          item_id: "water_potable"
          quantity: 100
      idle_consumption_per_hour:
        - supply_class: "CLASS_I"
          item_id: "water_potable"
          quantity: 5
    - side: "red"
      unit_type: "m1a2"
      initial_inventory:
        - supply_class: "CLASS_I"
          item_id: "water_potable"
          quantity: 20
      maximum_inventory:
        - supply_class: "CLASS_I"
          item_id: "water_potable"
          quantity: 100
      idle_consumption_per_hour:
        - supply_class: "CLASS_I"
          item_id: "water_potable"
          quantity: 5
  route_templates:
    - route_id: "blue_main_armor"
      side: "blue"
      depot_id: "blue_main_depot"
      unit_types: ["m1a2"]
      transport_mode: "ROAD"
      transport_speed_kph: 40
      capacity_tons_per_hour: 100
      condition: 1.0
    - route_id: "blue_forward_armor"
      side: "blue"
      depot_id: "blue_forward_depot"
      unit_types: ["m1a2"]
      transport_mode: "ROAD"
      transport_speed_kph: 30
      capacity_tons_per_hour: 30
      condition: 1.0
    - route_id: "red_armor"
      side: "red"
      depot_id: "red_depot"
      unit_types: ["m1a2"]
      transport_mode: "ROAD"
      transport_speed_kph: 35
      capacity_tons_per_hour: 60
      condition: 1.0

objectives:
  - objective_id: "obj_crossroads"
    position: [15000, 7500]
    radius_m: 600
    type: "key_terrain"

victory_conditions:
  - type: "supply_exhausted"
    params:
      threshold: 0.15
  - type: "force_destroyed"
    params:
      threshold: 0.7
  - type: "time_expired"
    side: "draw"
    params:
      max_duration_s: 259200

calibration_overrides:
  hit_probability_modifier: 1.0
  target_size_modifier: 1.0

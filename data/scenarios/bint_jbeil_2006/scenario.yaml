# Battle of Bint Jbeil — 24 July – 3 August 2006
#
# IDF Northern Command (Galei Tzahal sector) vs Hezbollah defenders in
# the stone-built hilltop town of Bint Jbeil, southern Lebanon
# (~900 m elevation, 4 km north of Israel-Lebanon border). Part of the
# broader 2006 Lebanon War (Second Lebanon War / July War).
#
# Forces:
# - Blue: IDF Division 91 Golani Brigade + 35th Paratroopers + Merkava
#   Mk III/Mk IV from 7th and 401st Armored Brigades, Egoz + Maglan SOF,
#   M109 and M270 MLRS fires, F-16I + AH-64 Saraph + AH-1 Tzefa CAS.
# - Red: Hezbollah "Nasr Force" (Southern Lebanon command) — local
#   defenders + IRGC-trained SF cadre + Kornet ATGM tank-hunter teams
#   + mortar cells. ~60-100 local + 40 SF + 5-8 ATGM teams (IDF est).
#
# Historical outcome (Matthews CSI 2008, Harel & Issacharoff 2008,
# Cordesman CSIS 2006, Biddle & Friedman USAWC 2008):
# - CONTESTED. IDF held ground but did not decisively clear town
#   within battle window. Hezbollah ATGM ambushes (26 Jul Goliath
#   ambush on Golani Recon) were the defining tactical narrative.
# - Duration ~10 days intermittent combat; main thrust 26-28 Jul
# - IDF: 8 KIA in 26 Jul ambush alone; ~15 KIA + ~50 WIA overall
# - Hezbollah: ~30-40 KIA in sector (IDF claim, disputed)
# - Merkava Mk IV: 2-3 hits in Bint Jbeil sector (first serious
#   Mk IV combat-loss record; Trophy APS not yet fielded in 2006)
# - Key dynamic: Kornet 9M133 + RPG-29 tandem-HEAT defeat Merkava
#   side/rear armor from prepared ambushes in stone buildings.
#
# Political sensitivity guardrails (per Block 11 brainstorm):
# - Tactical framing only
# - Source discipline — all data cited to Tier 1-2 sources
# - Neutral language — "contested" modeled as DRAW_SCENARIO
#
# Sources:
# - Matthews, "We Were Caught Unprepared: The 2006 Hezbollah-Israeli
#   War," Combat Studies Institute 2008 (Tier 1)
# - Harel & Issacharoff, "34 Days: Israel, Hezbollah, and the War in
#   Lebanon," Palgrave Macmillan 2008 (Tier 2)
# - Cordesman, "Preliminary Lessons of the Israeli-Hezbollah War,"
#   CSIS 2006 (Tier 1)
# - Biddle & Friedman, "The 2006 Lebanon Campaign and the Future of
#   Warfare," US Army War College 2008 (Tier 1)
# - Blanford, "Warriors of God," Random House 2011 (Tier 2)


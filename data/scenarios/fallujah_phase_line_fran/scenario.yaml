# Second Battle of Fallujah — Operation Al-Fajr / Phantom Fury
# 8 November – 23 December 2004 (main combat 8–16 November)
#
# Urban assault on insurgent-held Fallujah by I MEF / 1st Marine
# Division — RCT-1 (Col Shupp, north) and RCT-7 (Col Tucker, south),
# reinforced by Army TF 2-7 CAV (LTC Newell, 2nd Battalion 7th Cavalry,
# 1st Cavalry Division) providing the armored thrust down Phase Line
# Henry into Jolan, plus 2nd Battalion 2nd Infantry and 2-2 IN BCT for
# rear-area clearance.  British Black Watch blocking east.  Iraqi
# Interim Government army (36th Commando + 2-1 Iraqi Intervention Bde)
# provide mosque-clearance / interpreter / indigenous forces.
#
# Defenders: ~3,000-4,000 insurgents, mix of Iraqi Sunni fighters
# (Ba'athist remnants, IAI, 1920 Revolution Brigade) and foreign
# fighters (AQI under Zarqawi, Chechens, Ansar al-Sunnah).  Several
# hundred hardcore foreign fighters prepared IED-belt defenses:
# house-borne IEDs, booby-trapped alleys, sniper positions in
# mosque/minaret complexes, technical fighting positions with DShK
# / SPG-9 / PKM.
#
# Historical phases simulated here: 8 Nov kinetic shaping + TF 2-7 CAV
# armored thrust into Jolan; 9 Nov RCT-1 seizure of Al-Kabir Mosque
# (Regimental Objective Delta) by Kilo 3/5 at first light; 10 Nov
# Phase Line Fran crossing and HBIED-belt clearance; 11 Nov WP / HE
# "shake-and-bake" on Askari / Jolan strongpoints; 12-14 Nov sector
# consolidation.  Ends ~16 Nov after Jolan stabilizes.
#
# Historical outcome: Coalition tactical success.  Insurgent force
# destroyed or dispersed.  Marine casualties ~54 KIA / ~425 WIA.
# Army casualties ~18 KIA / ~200 WIA.  Iraqi Army ~8 KIA.  Insurgent
# losses ~1,200-2,000 KIA, ~1,500 captured.  City infrastructure
# damage extensive; civilian population 90%+ evacuated pre-assault
# (estimated 50,000 remained).  Zarqawi and senior AQI leadership
# escaped prior to the cordon.
#
# Sources:
# - Estes, "U.S. Marines in Iraq 2004–2005: Into the Fray,"
#   USMC History Division 2011 (Tier 1)
# - Matthews, "Operation AL FAJR: A Study in Army and Marine Corps
#   Joint Operations," CSI Global War on Terrorism Occasional
#   Paper 20, 2006 (Tier 1)
# - West, "No True Glory: A Frontline Account of the Battle for
#   Fallujah," Bantam 2005 (Tier 2 — journalistic, but Bing West was
#   embedded Marine)
# - Grossman, "AC-130s told to be ready for daylight mission in
#   Fallujah," Inside the Pentagon, 18 Nov 2004 (Tier 2)
# - Malkasian, "Signaling resolve, democratization, and the first
#   battle of Fallujah," Journal of Strategic Studies 2006 (Tier 2)
# - USMC "Second Battle of Fallujah Historical Study" (AAR) via
#   USMC History Division archives (Tier 1)

name: "Fallujah Phase Line Fran 2004 — RCT-1/RCT-7 + TF 2-7 CAV vs Insurgent Defenders"
date: "2004-11-08T19:00:00+03:00"  # D-Day 8 Nov evening kick-off ("Night Stalker" phase)
duration_hours: 120  # 5 days — 8 Nov 1900L through 13 Nov 1900L main urban assault
tick_duration_seconds: 5.0

# Hybrid resolution — strategic for approach/staging, operational for
# maneuver phase-line crossings, tactical for urban firefights.
tick_resolution:
  strategic_s: 1800     # 30-min tick for strategic positioning
  operational_s: 300    # 5-min tick during Phase Line Fran crossing
  tactical_s: 5         # 5-sec tick for urban house-to-house combat

# ~33.35°N, 43.78°E — Fallujah, Al-Anbar Province, Iraq
latitude: 33.35
longitude: 43.78

weather_conditions:
  # Autumn conditions — daytime mild, cool nights.  Morning fog / haze
  # common; occasional dust from passing Humvees.  Cloud cover reduced
  # AC-130 daylight availability (see scripted events).  Wind mild.
  visibility_m: 7000
  wind_speed_mps: 3.0
  wind_direction_deg: 315
  temperature_c: 18.0
  precipitation: none
  cloud_cover: 0.3
  humidity: 0.40

terrain:
  # Fallujah AO: ~6km x 4km urban core plus ~2km staging perimeter.
  # Real Fallujah is a dense grid of 1-3 story buildings, minarets,
  # market strip along Highway 10 (Phase Line Fran), Jolan quarter in
  # NW, Askari quarter in SE.  Euphrates bend on NW edge.  Engine
  # terrain_type allows {flat_desert, open_ocean, hilly_defense,
  # trench_warfare, open_field} — use hilly_defense as closest urban
  # proxy (cover density, slower movement, sniper pickets); cover +
  # concealment multipliers in calibration capture the urban mechanics.
  width_m: 10000
  height_m: 8000
  cell_size_m: 50.0      # finer resolution for urban combat
  base_elevation_m: 35.0
  terrain_type: hilly_defense

sides:
  # ── Blue: Coalition (RCT-1, RCT-7, TF 2-7 CAV) ───────────────────
  - side: blue
    units:
      # RCT-1 (Col Shupp) — 3/1, 3/5, 1/8 Marines drive south/east
      # RCT-7 (Col Tucker) — 1/3, 1/8 Marines secondary thrust.
      # Scaled to represent the ~12,000-man direct assault force at
      # company/squad level; distributed across both regiments.
      - unit_type: us_marine_rifle_squad_urban
        count: 72
        overrides:
          training_level: 0.85
      # TF 2-7 CAV (LTC Newell, 2nd BN 7th Cavalry) — armored thrust
      # into Jolan via Highway 10 pre-dawn 9 Nov.
      - unit_type: us_army_infantry_cav
        count: 16
        overrides:
          training_level: 0.80
      - unit_type: us_m1a2_sep
        count: 20
        overrides:
          training_level: 0.85
      - unit_type: us_m2a3_bradley
        count: 26
        overrides:
          training_level: 0.80
      # Combat engineers — RCT-1 breach teams (MCT, combat eng plat)
      - unit_type: us_combat_engineer_urban
        count: 16
        overrides:
          training_level: 0.85
      # D9 bulldozers — armored dozers for obstacle reduction and
      # rubble clearance (USMC + Army engineer plat).
      - unit_type: us_d9_bulldozer
        count: 6
      # M1064 120mm mortars — TF 2-7 CAV organic indirect fire
      - unit_type: us_m1064_mortar
        count: 6
      # 11th Marines M109A6 artillery on Phase Line Fran
      - unit_type: m109a6
        count: 6
      # Marine Recon teams (snipers, forward observers)
      - unit_type: us_marine_recon_team
        count: 8
      # Combat air stack
      - unit_type: ac130u
        count: 2
        overrides:
          # AC-130U normally night-only; daylight authorization from
          # 18 Nov was unprecedented (Grossman 2004).  Scenario opens
          # at evening so AC-130 starts on-station.
          training_level: 0.92
      - unit_type: oh58d_kiowa
        count: 4
        overrides:
          training_level: 0.85
      - unit_type: fa18c
        count: 4
      - unit_type: ah1w
        count: 4
      # UAV ISR — 1st Mar Div + Army organic
      - unit_type: dragon_eye_uav
        count: 6
      - unit_type: scaneagle_uav
        count: 2
    experience_level: 0.82
    morale_initial: STEADY
    commander_profile: aggressive_armor
    doctrine_template: combined_arms_offense

  # ── Red: Insurgent defenders (3,000-4,000 fighters estimated) ────
  - side: red
    units:
      # Iraqi Sunni fighters — main defensive force, mixed
      # Ba'athist remnants / IAI / 1920 RB / tribal fighters
      - unit_type: iraqi_insurgent_urban
        count: 85
        overrides:
          training_level: 0.35
      # Foreign fighters — AQI under Zarqawi, Chechens, Ansar al-Sunnah
      # Concentrated in Jolan (NW quadrant).  Hardened kernel.
      - unit_type: iraqi_foreign_fighter
        count: 40
        overrides:
          training_level: 0.65
      # Insurgent mortar teams — 82mm 2B14 tubes mobile between
      # prepared fighting positions.
      - unit_type: iraqi_insurgent_mortar_team
        count: 10
        overrides:
          training_level: 0.30
    experience_level: 0.40
    morale_initial: STEADY
    commander_profile: attritional_defender
    doctrine_template: attritional_defense

objectives:
  # Phase Line Henry — northern LD (line of departure)
  - objective_id: phase_line_henry
    position: [5000.0, 6500.0]
    radius_m: 500.0
    type: key_terrain
  # Phase Line Fran — Highway 10 central east-west line, splits
  # Fallujah north/south.  Main objective of D+1 crossing.
  - objective_id: phase_line_fran
    position: [5000.0, 4000.0]
    radius_m: 500.0
    type: key_terrain
  # Al-Kabir Mosque (Regimental Objective Delta) — RCT-1's mosque
  # seizure by Kilo 3/5 at first light 10 Nov.  Symbolic and tactical
  # key terrain (minaret sniper nest, mortar baseplate cache).
  - objective_id: al_kabir_mosque
    position: [4500.0, 5000.0]
    radius_m: 150.0
    type: key_terrain
  # Jolan quarter — NW sector, AQI/Chechen stronghold.
  - objective_id: jolan_quarter
    position: [3000.0, 5500.0]
    radius_m: 600.0
    type: territory
  # Askari quarter — SE sector, secondary strongpoint.
  - objective_id: askari_quarter
    position: [7000.0, 2500.0]
    radius_m: 500.0
    type: territory

victory_conditions:
  # Coalition wins when insurgent force is destroyed ≥50% OR insurgent
  # morale collapses.  Historical outcome: ~50-60% KIA + ~40%
  # displaced/captured = majority force destroyed.
  - type: force_destroyed
    side: blue
    params:
      threshold: 0.5
      target_side: red
  - type: morale_collapsed
    side: blue
    params:
      target_side: red
  # Time fallback: coalition holds if insurgent defense doesn't break
  # within 120 hours (5-day main assault window).
  - type: time_expired
    side: blue
    params:
      max_duration_s: 432000  # 120 hours

# ── Pre-emplaced IEDs / HBIEDs (Phase 101) ─────────────────────────
# Insurgent defenders wired the city for weeks before the assault.
# HBIEDs (house-borne IEDs) are booby-trapped buildings: trigger when
# a coalition unit enters.  Concentrated along main north-south axes
# (Phase Line Henry -> Fran corridor), Jolan approach routes, and
# Al-Kabir Mosque inner perimeter.
initial_ieds:
  # Jolan quarter HBIED belt (NW — AQI/Chechen zone, heaviest prep)
  - position: [3200.0, 5800.0]
    subtype: hbied
    blast_radius_m: 25.0
    concealment: 0.92
    emplaced_by: aqi_defender
  - position: [3400.0, 5600.0]
    subtype: hbied
    blast_radius_m: 22.0
    concealment: 0.88
    emplaced_by: aqi_defender
  - position: [2900.0, 5400.0]
    subtype: hbied
    blast_radius_m: 28.0
    concealment: 0.90
    emplaced_by: chechen_cell
  - position: [3500.0, 5300.0]
    subtype: hbied
    blast_radius_m: 24.0
    concealment: 0.87
  # Al-Kabir Mosque approach (mosque seizure axis — Kilo 3/5)
  - position: [4300.0, 5100.0]
    subtype: hbied
    blast_radius_m: 20.0
    concealment: 0.85
  - position: [4700.0, 5100.0]
    subtype: hbied
    blast_radius_m: 20.0
    concealment: 0.85
  # Phase Line Fran crossing IEDs (Highway 10 buildings)
  - position: [4500.0, 4100.0]
    subtype: hbied
    blast_radius_m: 22.0
    concealment: 0.80
  - position: [5500.0, 4100.0]
    subtype: hbied
    blast_radius_m: 22.0
    concealment: 0.80
  - position: [6000.0, 4200.0]
    subtype: hbied
    blast_radius_m: 22.0
    concealment: 0.80
  # Traditional command-wire IEDs along road median (slower-acting)
  - position: [5000.0, 3800.0]
    subtype: command_wire
    blast_radius_m: 15.0
    concealment: 0.70
  - position: [5200.0, 3700.0]
    subtype: command_wire
    blast_radius_m: 15.0
    concealment: 0.70
  # Askari quarter (SE — lighter belt)
  - position: [6800.0, 2700.0]
    subtype: hbied
    blast_radius_m: 18.0
    concealment: 0.78
  - position: [7200.0, 2400.0]
    subtype: hbied
    blast_radius_m: 18.0
    concealment: 0.78
  # Pressure plate IEDs — on footpaths and compound entries
  - position: [3800.0, 5200.0]
    subtype: pressure_plate
    blast_radius_m: 10.0
    concealment: 0.75
  - position: [4100.0, 4800.0]
    subtype: pressure_plate
    blast_radius_m: 10.0
    concealment: 0.75
  - position: [5800.0, 3500.0]
    subtype: pressure_plate
    blast_radius_m: 10.0
    concealment: 0.75
  # Southern approach (RCT-7 corridor)
  - position: [5500.0, 3000.0]
    subtype: hbied
    blast_radius_m: 20.0
    concealment: 0.82
  - position: [6200.0, 3200.0]
    subtype: hbied
    blast_radius_m: 20.0
    concealment: 0.82
  - position: [4800.0, 2800.0]
    subtype: command_wire
    blast_radius_m: 15.0
    concealment: 0.70
  # Al-Askari mosque secondary axis
  - position: [6500.0, 2800.0]
    subtype: hbied
    blast_radius_m: 18.0
    concealment: 0.80

# ── Scripted events (Phase 101) ────────────────────────────────────
# Historical moments scripted as honest engine calls: HBIED dets,
# WP fire zones, unit teleports for scripted maneuvers, casualty
# pulses for sniper ambushes.  No magic — real engine APIs.
#
# Timeline (relative to D-Day 8 Nov 1900L):
scripted_events:
  # 9 Nov pre-dawn (0200L = H+7h) — TF 2-7 CAV armored thrust down
  # Highway 10 into Jolan.  Teleport lead M1A2 to jump-off position
  # adjacent to Phase Line Henry.
  - time_s: 25200  # 7 h
    event_type: unit_teleport
    params:
      unit_id: blue_us_m1a2_sep_0088
      position: [3200.0, 6400.0]

  # 9 Nov early morning (0500L = H+10h) — Al-Kabir Mosque seizure
  # by Kilo 3/5 (Regimental Objective Delta) at first light.
  # Teleport two Marine urban squads to mosque perimeter.
  - time_s: 36000  # 10 h
    event_type: unit_teleport
    params:
      unit_id: blue_us_marine_rifle_squad_urban_0000
      position: [4520.0, 5020.0]

  - time_s: 36100
    event_type: unit_teleport
    params:
      unit_id: blue_us_marine_rifle_squad_urban_0001
      position: [4480.0, 4980.0]

  # 10 Nov 0900L (H+38h) — first HBIED detonation on Kilo 3/5 team
  # advancing into Jolan.  Historical: multiple HBIED dets against
  # RCT-1 during Phase Line Fran crossing.
  - time_s: 136800  # 38 h
    event_type: hbied_detonation
    params:
      obstacle_index: 0  # first Jolan HBIED from initial_ieds list
      target_unit_id: blue_us_marine_rifle_squad_urban_0003

  # 10 Nov afternoon (1500L = H+44h) — sniper ambush on Marine squad
  # by foreign-fighter sniper concealed in minaret.  Historical:
  # several RCT-1 sniper incidents 10-11 Nov.  Casualty pulse models
  # 3 KIA before counter-sniper engagement clears the position.
  - time_s: 158400  # 44 h
    event_type: casualty_pulse
    params:
      unit_id: blue_us_marine_rifle_squad_urban_0005
      casualties: 3

  # 10 Nov evening (2100L = H+50h) — SMAW NE thermobaric building
  # collapse on Jolan strongpoint.  Historical: RCT-1 used SMAW NE
  # and M72A7 LAW extensively for building reduction 10-12 Nov.
  # Modeled as a casualty pulse on the insurgent cell in the
  # collapsed building.
  - time_s: 180000  # 50 h
    event_type: casualty_pulse
    params:
      unit_id: red_iraqi_foreign_fighter_0085
      casualties: 5

  # 11 Nov morning (1000L = H+63h) — WP "shake and bake" preparatory
  # fires on Askari strongpoint before RCT-7 assault.  Historical:
  # 11th Marines fired WP + HE combo ("shake-and-bake") 11-12 Nov.
  # Creates a fire zone that drives insurgents out of positions and
  # produces smoke.
  - time_s: 226800  # 63 h
    event_type: wp_fire_zone
    params:
      center: [6900.0, 2600.0]
      radius_m: 80.0
      fuel_load: 0.6
      duration_s: 2400.0

  # 11 Nov afternoon (1500L = H+68h) — second HBIED detonation on
  # TF 2-7 CAV dismounted infantry clearing apartment block.
  - time_s: 244800  # 68 h
    event_type: hbied_detonation
    params:
      obstacle_index: 6  # Phase Line Fran area HBIED
      target_unit_id: blue_us_army_infantry_cav_0074

  # 11 Nov evening (1900L = H+72h) — second WP fire zone on Jolan
  # holdouts near Al-Kabir Mosque complex.
  - time_s: 259200  # 72 h
    event_type: wp_fire_zone
    params:
      center: [3300.0, 5500.0]
      radius_m: 70.0
      fuel_load: 0.55
      duration_s: 2100.0

  # 12 Nov morning (0800L = H+85h) — third HBIED detonation on
  # RCT-7 squad clearing southern sector.
  - time_s: 306000  # 85 h
    event_type: hbied_detonation
    params:
      obstacle_index: 12  # Askari quarter HBIED
      target_unit_id: blue_us_marine_rifle_squad_urban_0020

  # 12 Nov afternoon (1400L = H+91h) — sniper ambush in Askari.
  # Counter-sniper team (marine_recon) dispatched to neutralize.
  - time_s: 327600  # 91 h
    event_type: casualty_pulse
    params:
      unit_id: blue_us_marine_rifle_squad_urban_0022
      casualties: 2

calibration_overrides:
  # ── Engine enable flags (Phase 67+ modern defaults) ──────────────
  enable_obscurants: true
  enable_thermal_crossover: true
  enable_nvg_detection: true
  enable_fuel_consumption: true
  enable_ammo_gate: true
  enable_air_routing: true
  enable_missile_routing: true
  enable_fire_zones: true
  enable_unconventional_warfare: true

  # ── Combat fidelity ──────────────────────────────────────────────
  hit_probability_modifier: 0.85  # urban clutter reduces P(hit)
  target_size_modifier: 0.70      # infantry in cover smaller targets
  thermal_contrast: 1.0           # urban masonry thermally complex

  # ── Morale — insurgent hardcore doesn't collapse easily, but ───
  # ── foreign fighters / civilians will. ──────────────────────────
  morale_degrade_rate_modifier: 0.6  # slower collapse than open-field
  morale_force_ratio_weight: 0.20
  morale_base_degrade_rate: 0.015
  morale_casualty_weight: 0.80
  morale_check_interval: 15

  # Rout cascade more conservative — urban defenders fight dug-in,
  # don't cascade as readily as open-field mechanized units.
  rout_cascade_radius_m: 200.0
  rout_cascade_base_chance: 0.15
  rout_cascade_shaken_susceptibility: 0.5

  # ── Engagement thresholds ────────────────────────────────────────
  destruction_threshold: 0.5      # tougher to destroy dug-in defenders
  disable_threshold: 0.30

  # ── Force-ratio / CEV — USMC/Army elite + overwhelming supporting
  # arms + 2-week shaping vs entrenched insurgent defenders.  Per
  # Matthews 2006: coalition combat power ratio ~3:1 in maneuver
  # elements but insurgent defensive multiplier from urban terrain
  # is ~2-3x. Net: ~1.4-1.6 CEV advantage after accounting for
  # urban friction.
  blue_force_ratio_modifier: 1.6
  red_force_ratio_modifier: 0.7
  blue_cohesion: 0.88
  red_cohesion: 0.50

  # ── Starting positions — scenario opens at D-Day 1900L with blue
  # staged north of Phase Line Henry and red dispersed throughout
  # the urban core.
  blue_start_x: 5000.0
  blue_start_y: 7000.0           # north of Phase Line Henry
  blue_formation_spacing_m: 80.0
  red_start_x: 5000.0
  red_start_y: 4500.0            # dispersed across urban core
  red_formation_spacing_m: 150.0 # wider spacing — insurgents in FP network

  # ── Weapon assignments — equipment name -> weapon_id ─────────────
  weapon_assignments:
    # Coalition small arms
    "M16A4 Rifle": m16a4
    "M4A1 SOPMOD": m4_556mm
    "M249 SAW": m4_556mm
    "M240B GPMG": m240_762mm
    "M240 7.62mm Coaxial": m240_762mm
    "M240 7.62mm Loader": m240_762mm
    "M203 40mm Grenade Launcher": m4_556mm
    "M2 .50 Cal": m2hb_50cal
    "M296 .50 Cal MG": m2hb_50cal
    "Benelli M1014 Shotgun": m4_556mm
    # Coalition anti-armor / urban breach
    "Mk 153 SMAW": mk153_smaw
    "AT-4 LAW": at4_law
    "M72A7 LAW": m72a7_law
    "FGM-148 Javelin CLU": javelin_clm
    "Javelin Missile Round": javelin_clm
    "BGM-71 TOW-2 Launcher": tow2_atgm
    # Coalition heavy / armor
    "M256 120mm Smoothbore": m256_120mm
    "M242 25mm Chain Gun": m242_bushmaster
    # Coalition engineer
    "C4 Demolition Block (M112)": m4_556mm
    "Bangalore Torpedo (M1A2)": m4_556mm
    "MICLIC Line Charge": m4_556mm
    "D9 Blade & Rippers": m4_556mm
    # Coalition indirect fire
    "M121 120mm Mortar": m121_120mm_mortar
    "M284 155mm Howitzer": m284_155mm
    # Coalition air
    "GAU-12 Equalizer 25mm": gau12_25mm
    "AGM-114 Hellfire Launcher": agm114_hellfire
    "M197 20mm Rotary Cannon": m197_20mm
    "M61A1 Vulcan 20mm": m61a1_vulcan
    "105mm M102 Howitzer (direct-fire mount)": ac130_105mm
    "40mm Bofors L/60 Automatic Gun": ac130_40mm_bofors
    "M260 2.75-inch Rocket Pod": bomb_rack_generic
    "Wing/Fuselage Ordnance Stations": bomb_rack_generic
    "AIM-9L Sidewinder": aim9x_sidewinder
    "AIM-9M Sidewinder": aim9x_sidewinder
    # Insurgent small arms
    "AKM": ak47
    "AK-74": ak47
    "SVD Dragunov": ak47
    "PKM GPMG": m240_762mm

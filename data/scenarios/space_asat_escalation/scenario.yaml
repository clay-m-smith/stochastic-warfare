# Hypothetical space validation scenario: one catalog-backed direct-ascent
# strike against an exact, reachable enemy LEO imaging satellite.
name: "Space ASAT Escalation"
date: "2024-06-15"
duration_hours: 12.0
latitude: 33.0
longitude: 35.0
tick_duration_seconds: 3600.0

terrain:
  width_m: 10000.0
  height_m: 10000.0
  cell_size_m: 100.0
  base_elevation_m: 200.0
  terrain_type: flat_desert

weather_conditions:
  initial_state: CLEAR
  temperature: 28.0
  humidity: 0.3

sides:
  - side: blue
    units:
      - unit_type: f16c
        count: 4
      - unit_type: m1a2
        count: 4
    experience_level: 0.7
    commander_profile: balanced_default
    doctrine_template: us_combined_arms
  - side: red
    units:
      - unit_type: t72m
        count: 8
    experience_level: 0.6
    commander_profile: aggressive_armor
    doctrine_template: russian_deep_ops

objectives:
  - objective_id: air_base
    position: [5000.0, 5000.0]
    radius_m: 500.0
    type: infrastructure

victory_conditions:
  - type: time_expired
    side: ""
    params:
      max_time_s: 43200

calibration_overrides:
  blue_start_x: 2000.0
  blue_start_y: 5000.0
  red_start_x: 8000.0
  red_start_y: 5000.0

space_config:
  enable_space: true
  constellation_ids:
    - keyhole_optical
  enable_asat: true
  asat_assets:
    - asset_id: red_nudol_1
      weapon_id: nudol_asat
      side: red
      rounds_available: 1
  asat_orders:
    - order_id: red_keyhole_strike_1
      asset_id: red_nudol_1
      target_satellite_id: keyhole_optical_p0_s0
      execute_at_s: 7200.0

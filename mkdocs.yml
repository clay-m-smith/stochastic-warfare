site_name: Stochastic Warfare
site_description: High-fidelity stochastic wargame simulator — multi-scale, multi-domain, multi-era
site_author: Clay Smith
site_url: https://clay-m-smith.github.io/stochastic-warfare
repo_url: https://github.com/clay-m-smith/stochastic-warfare
repo_name: clay-m-smith/stochastic-warfare

theme:
  name: material
  palette:
    - scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

validation:
  nav:
    omitted_files: ignore
  links:
    anchors: warn

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tilde
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - def_list

nav:
  - Home: index.md
  - Guide:
    - Getting Started: guide/getting-started.md
    - Web UI: guide/web-ui.md
    - Scenario Library: guide/scenarios.md
  - Concepts:
    - Architecture Overview: concepts/architecture.md
    - Mathematical Models: concepts/models.md
  - Reference:
    - API Reference: reference/api.md
    - Eras: reference/eras.md
    - Units & Equipment: reference/units.md
  - Engineering:
    - Consolidation Contract: specs/tiered-modular-monolith.md
    - Current Roadmap: development-phases-block13.md
    - Future Roadmaps:
      - Block 14 (128-130): development-phases-block14.md
      - Block 15 (131): development-phases-block15.md
      - Block 16 (132): development-phases-block16.md
      - Block 17 (133): development-phases-block17.md
      - Block 18 (134): development-phases-block18.md
      - Block 19 (135-137): development-phases-block19.md
      - Block 20 (138-140): development-phases-block20.md
      - Block 21 (141-142): development-phases-block21.md
    - Remediation Backlog: remediation-backlog.md
    - Phase History: devlog/index.md
  - Specifications:
    - Project Structure: specs/project-structure.md
    - Checkpoint State Contract: specs/checkpoint-state.md
    - Equipment Mapping and Runtime Loadouts: specs/equipment-mapping.md
    - ASAT Production Integration: specs/asat-production-integration.md
    - Time-on-Target Execution: specs/time-on-target-execution.md
    - Validation and Documentation Trust: specs/validation-and-documentation-trust.md
    - Fog-of-War Contact Continuation: specs/fog-of-war-contact-continuation.md
    - Historical Outcome-Envelope Integrity: specs/historical-outcome-envelope-integrity.md
    - Performance-Flag Semantic Integrity: specs/performance-flag-semantic-integrity.md
    - Morale State Ownership: specs/morale-state-ownership.md
    - Era Override Execution: specs/era-override-execution.md
    - Sensing-Aware Tactical Standoff: specs/sensing-aware-tactical-standoff.md
    - Skills & Hooks: skills-and-hooks.md
